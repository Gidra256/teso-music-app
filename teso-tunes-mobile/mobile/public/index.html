<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="robots" content="index,follow" />
    <meta
      name="description"
      content="Discover Teso music, artists and new releases on TesoHub Music. Listen, follow your favorite artists, build playlists and explore music from the Teso community."
    />
    <link rel="canonical" href="https://tesohubmusic.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TesoHub Music" />
    <meta property="og:title" content="TesoHub Music — Discover Teso Music &amp; Artists" />
    <meta
      property="og:description"
      content="Discover Teso music, artists and new releases on TesoHub Music. Listen, follow your favorite artists, build playlists and explore music from the Teso community."
    />
    <meta property="og:url" content="https://tesohubmusic.com/" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TesoHub Music" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/tesohub-music.png" />
    <title>TesoHub Music — Discover Teso Music &amp; Artists</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "TesoHub Music",
        "url": "https://tesohubmusic.com/"
      }
    </script>
    <style id="expo-reset">
      html,
      body {
        background: #050506;
        height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
      }

      #root {
        display: flex;
        flex: 1;
        height: 100%;
      }

      .startup-fallback {
        align-items: center;
        box-sizing: border-box;
        color: #ffffff;
        display: flex;
        flex: 1;
        flex-direction: column;
        font-family: Arial, sans-serif;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }

      .startup-fallback__title {
        font-size: 28px;
        font-weight: 700;
        margin: 0 0 10px;
      }

      .startup-fallback__status {
        color: #20dce5;
        font-size: 16px;
        margin: 0 0 12px;
      }

      .startup-fallback__help {
        color: #a9afb7;
        font-size: 13px;
        line-height: 1.5;
        margin: 0;
        max-width: 360px;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run TesoHub Music.</noscript>
    <div id="root">
      <main class="startup-fallback" role="status" aria-live="polite">
        <h1 class="startup-fallback__title">TesoHub Music</h1>
        <p class="startup-fallback__status">Loading...</p>
        <p class="startup-fallback__help">
          If this screen remains, this browser may not support the full TesoHub Music app.
        </p>
      </main>
    </div>
  </body>
</html>
