<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TesoHub Music Admin Console</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #050506;
        --surface: #0b0b10;
        --card: #111116;
        --elevated: #1b1b23;
        --border: #2b2638;
        --primary: #20e6f3;
        --accent: #f427c8;
        --success: #36f2a5;
        --danger: #ff4d6d;
        --warning: #ffca4a;
        --text: #ffffff;
        --soft: #d8d8e2;
        --muted: #8b8798;
      }

      * {
        box-sizing: border-box;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        align-items: center;
        background: var(--primary);
        border: 1px solid transparent;
        border-radius: 8px;
        color: #031013;
        cursor: pointer;
        display: inline-flex;
        font-size: 13px;
        font-weight: 900;
        justify-content: center;
        min-height: 40px;
        padding: 0 13px;
      }

      button.secondary {
        background: var(--elevated);
        border-color: var(--border);
        color: var(--soft);
      }

      button.ghost {
        background: transparent;
        border-color: var(--border);
        color: var(--soft);
      }

      button.danger {
        background: var(--danger);
        color: #180107;
      }

      button.active {
        background: var(--primary);
        color: #031013;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.58;
      }

      input,
      select,
      textarea {
        background: #09090d;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        min-height: 40px;
        padding: 10px;
        width: 100%;
      }

      input[type="checkbox"] {
        min-height: auto;
        width: auto;
      }

      label {
        color: var(--soft);
        display: grid;
        font-size: 12px;
        font-weight: 900;
        gap: 6px;
      }

      textarea {
        min-height: 96px;
        resize: vertical;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font-size: clamp(26px, 4vw, 38px);
        font-weight: 950;
        line-height: 1;
      }

      h2 {
        font-size: 19px;
      }

      h3 {
        font-size: 15px;
      }

      .login {
        margin: 12vh auto 0;
        max-width: 430px;
        padding: 20px;
      }

      .login .panel {
        padding: 22px;
      }

      .shell {
        display: grid;
        gap: 20px;
        grid-template-columns: 260px minmax(0, 1fr);
        min-height: 100vh;
        padding: 18px;
      }

      .sidebar {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 14px;
        position: sticky;
        top: 18px;
        height: calc(100vh - 36px);
      }

      .brand {
        align-items: center;
        display: flex;
        gap: 10px;
      }

      .logo {
        background: #000;
        border-radius: 8px;
        height: 44px;
        object-fit: cover;
        width: 44px;
      }

      .brand-title {
        font-size: 16px;
        font-weight: 950;
      }

      .muted,
      .subtitle {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .nav {
        display: grid;
        gap: 6px;
        overflow: auto;
      }

      .nav-title {
        color: var(--muted);
        font-size: 11px;
        font-weight: 900;
        margin: 12px 0 3px;
        text-transform: uppercase;
      }

      .nav button {
        justify-content: flex-start;
        min-height: 38px;
        width: 100%;
      }

      .content {
        display: grid;
        gap: 18px;
        min-width: 0;
      }

      .content.content-bounded {
        grid-template-rows: auto minmax(0, 1fr);
        height: calc(100vh - 36px);
        overflow: hidden;
      }

      .topbar {
        align-items: flex-start;
        display: flex;
        gap: 12px;
        justify-content: space-between;
      }

      .panel {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
      }

      .grid {
        display: grid;
        gap: 14px;
      }

      .grid.two {
        grid-template-columns: minmax(280px, 0.85fr) minmax(0, 1.45fr);
      }

      .grid.three {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .stats {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(4, minmax(140px, 1fr));
      }

      .stat {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 14px;
      }

      .stat-value {
        font-size: 28px;
        font-weight: 950;
        margin-top: 8px;
      }

      .form {
        display: grid;
        gap: 12px;
      }

      .form-row {
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .toolbar,
      .actions {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .toolbar {
        justify-content: space-between;
      }

      .list {
        display: grid;
        gap: 10px;
      }

      .content.content-bounded #view,
      .split-dashboard,
      .split-panel {
        min-height: 0;
      }

      .split-dashboard {
        height: 100%;
      }

      .split-panel {
        display: flex;
        flex-direction: column;
        max-height: 100%;
        overflow: hidden;
      }

      .split-form-panel {
        overflow: auto;
        overscroll-behavior: contain;
      }

      .split-list-header {
        background: var(--card);
        flex: 0 0 auto;
        padding-bottom: 12px;
      }

      .split-list-header + .scroll-region {
        border-top: 1px solid var(--border);
        padding-top: 12px;
      }

      .scroll-region {
        min-height: 0;
        overflow: auto;
        overscroll-behavior: contain;
        padding-right: 4px;
      }

      .item {
        align-items: start;
        background: #09090d;
        border: 1px solid var(--border);
        border-radius: 8px;
        display: grid;
        gap: 12px;
        grid-template-columns: 72px minmax(0, 1fr) auto;
        padding: 10px;
      }

      .thumb {
        background: var(--elevated);
        border-radius: 8px;
        height: 72px;
        object-fit: cover;
        width: 72px;
      }

      .item-title {
        font-weight: 950;
      }

      .meta {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
        margin-top: 4px;
      }

      .details {
        color: var(--soft);
        font-size: 13px;
        line-height: 1.55;
        margin-top: 8px;
      }

      .badge {
        background: rgba(32, 230, 243, 0.12);
        border: 1px solid rgba(32, 230, 243, 0.32);
        border-radius: 999px;
        color: var(--primary);
        display: inline-flex;
        font-size: 11px;
        font-weight: 950;
        padding: 4px 8px;
        text-transform: uppercase;
      }

      .badge.warn {
        background: rgba(255, 202, 74, 0.1);
        border-color: rgba(255, 202, 74, 0.32);
        color: var(--warning);
      }

      .badge.danger {
        background: rgba(255, 77, 109, 0.1);
        border-color: rgba(255, 77, 109, 0.32);
        color: var(--danger);
      }

      .badge.ok {
        background: rgba(54, 242, 165, 0.1);
        border-color: rgba(54, 242, 165, 0.32);
        color: var(--success);
      }

      .status-line {
        color: var(--accent);
        font-size: 13px;
        font-weight: 900;
        min-height: 18px;
      }

      .empty {
        color: var(--muted);
        padding: 10px 0;
      }

      audio {
        margin-top: 10px;
        max-width: 100%;
        width: 420px;
      }

      .hidden {
        display: none;
      }

      @media (max-width: 980px) {
        .content.content-bounded {
          display: grid;
          height: auto;
          overflow: visible;
        }

        .content.content-bounded #view,
        .split-dashboard {
          height: auto;
          overflow: visible;
        }

        .split-panel {
          max-height: none;
          overflow: visible;
        }

        .split-form-panel,
        .scroll-region {
          overflow: visible;
          padding-right: 0;
        }

        .shell {
          grid-template-columns: 1fr;
        }

        .sidebar {
          height: auto;
          position: static;
        }

        .nav {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .stats,
        .grid.three,
        .grid.two {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 680px) {
        .shell {
          padding: 12px;
        }

        .topbar,
        .toolbar {
          align-items: stretch;
          flex-direction: column;
        }

        .item {
          grid-template-columns: 56px minmax(0, 1fr);
        }

        .thumb {
          height: 56px;
          width: 56px;
        }

        .item .actions {
          grid-column: 1 / -1;
        }

        .form-row,
        .nav {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main id="loginPanel" class="login">
      <section class="panel">
        <form id="loginForm" class="form">
          <div class="brand">
            <img class="logo" src="/app-assets/images/tesohub-music.png" alt="" />
            <div>
              <h1>TesoHub Admin</h1>
              <p class="subtitle">Secure platform control centre</p>
            </div>
          </div>
          <label>Username<input id="loginUsername" value="admin" autocomplete="username" /></label>
          <label>Password<input id="loginPassword" type="password" autocomplete="current-password" /></label>
          <button type="submit">Sign in</button>
          <p id="loginStatus" class="status-line"></p>
        </form>
      </section>
    </main>

    <main id="adminPanel" class="shell hidden">
      <aside class="sidebar">
        <div class="brand">
          <img class="logo" src="/app-assets/images/tesohub-music.png" alt="" />
          <div>
            <div class="brand-title">TesoHub Music</div>
            <p id="adminRole" class="muted">Admin Console V1</p>
          </div>
        </div>
        <nav class="nav" id="nav"></nav>
        <button id="refreshButton" class="secondary" type="button">Refresh data</button>
        <button id="logoutButton" class="ghost" type="button">Logout</button>
      </aside>

      <section class="content">
        <div class="topbar">
          <div>
            <h1 id="viewTitle">Dashboard</h1>
            <p id="viewSubtitle" class="subtitle">Real backend data only</p>
          </div>
          <p id="status" class="status-line"></p>
        </div>
        <section id="view"></section>
      </section>
    </main>

    <script>
      const categories = ["Rappers", "Other Secular Artists", "Gospel Artists"];
      const applicationStatuses = ["pending", "approved", "rejected", "changes_requested"];
      const releaseStatuses = ["under_review", "approved", "scheduled", "published", "rejected", "draft"];
      const songStatuses = ["published", "hidden", "removed", "under_review"];
      const userStatuses = ["active", "suspended"];
      const reportStatuses = ["open", "reviewing", "resolved", "dismissed"];
      const views = [
        ["dashboard", "Dashboard", "Control centre overview"],
        ["applications", "Artist Applications", "Review applicant artists"],
        ["releases", "Release Review", "Listen and approve uploaded songs"],
        ["catalog", "Music Catalog", "Manage published and hidden songs"],
        ["artists", "Artists", "Manage artist profiles and status"],
        ["users", "Users", "Support and account status"],
        ["reports", "Reports", "Moderation queue"],
        ["discovery", "Home & Discovery", "Curated featured content"],
        ["genres", "Genres", "Master genre list"],
        ["settings", "Platform Settings", "Operational switches and upload policy"],
        ["health", "Platform Health", "Backend and storage visibility"],
        ["audit", "Audit Log", "Admin activity history"],
      ];

      const state = {
        activeView: "dashboard",
        admin: null,
        token: localStorage.getItem("tesoAdminToken") || "",
        dashboard: null,
        artists: [],
        songs: [],
        applications: [],
        releases: [],
        users: [],
        reports: [],
        genres: [],
        settings: null,
        flags: {},
        health: null,
        audit: [],
        editingArtistId: null,
        editingSongId: null,
        editingGenreId: null,
        filters: {
          applicationStatus: "",
          releaseStatus: "",
          catalogSearch: "",
          catalogStatus: "",
          userSearch: "",
          userRole: "",
          userStatus: "",
          reportStatus: "",
        },
      };

      const loginPanel = document.getElementById("loginPanel");
      const adminPanel = document.getElementById("adminPanel");
      const loginStatusEl = document.getElementById("loginStatus");
      const statusEl = document.getElementById("status");
      const contentEl = document.querySelector(".content");
      const viewEl = document.getElementById("view");
      const viewTitleEl = document.getElementById("viewTitle");
      const viewSubtitleEl = document.getElementById("viewSubtitle");
      const navEl = document.getElementById("nav");
      const adminRoleEl = document.getElementById("adminRole");
      const boundedViews = new Set(["artists", "catalog", "discovery", "genres"]);
      const scrollMemory = {};

      function setStatus(message) {
        statusEl.textContent = message || "";
      }

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function formatDate(value) {
        if (!value) return "No date";
        return String(value).slice(0, 10);
      }

      function number(value) {
        return Number(value || 0).toLocaleString();
      }

      function badge(value) {
        const status = String(value || "unknown");
        const tone = ["approved", "published", "active", "resolved"].includes(status)
          ? "ok"
          : ["rejected", "removed", "suspended", "dismissed"].includes(status)
            ? "danger"
            : ["pending", "under_review", "scheduled", "reviewing", "hidden"].includes(status)
              ? "warn"
              : "";
        return `<span class="badge ${tone}">${escapeHtml(status.replaceAll("_", " "))}</span>`;
      }

      function showLogin() {
        adminPanel.classList.add("hidden");
        loginPanel.classList.remove("hidden");
      }

      function showAdmin() {
        loginPanel.classList.add("hidden");
        adminPanel.classList.remove("hidden");
      }

      async function api(path, options = {}) {
        const headers = {
          ...(options.body instanceof FormData ? {} : { "Content-Type": "application/json" }),
          ...(state.token ? { Authorization: `Bearer ${state.token}` } : {}),
          ...(options.headers || {}),
        };
        const response = await fetch(path, { ...options, headers });
        const text = await response.text();
        const data = text ? JSON.parse(text) : null;

        if (!response.ok) {
          const message = data?.detail || `Request failed (${response.status})`;
          if (response.status === 403 && path !== "/admin-api/login") {
            localStorage.removeItem("tesoAdminToken");
            state.token = "";
            showLogin();
          }
          throw new Error(message);
        }
        return data;
      }

      async function fetchOptional(key, path) {
        try {
          state[key] = await api(path);
        } catch (error) {
          console.warn(path, error.message);
        }
      }

      async function loadData() {
        if (!state.token) return;
        rememberScrollPositions();
        setStatus("Loading admin data...");
        showAdmin();
        await Promise.all([
          fetchOptional("admin", "/admin-api/me"),
          fetchOptional("dashboard", "/admin-api/dashboard"),
          fetchOptional("artists", "/admin-api/artists"),
          fetchOptional("songs", "/admin-api/songs"),
          fetchOptional("applications", "/admin-api/artist-applications"),
          fetchOptional("releases", "/admin-api/releases"),
          fetchOptional("users", "/admin-api/users"),
          fetchOptional("reports", "/admin-api/reports"),
          fetchOptional("genres", "/admin-api/genres"),
          fetchOptional("settings", "/admin-api/platform-settings"),
          fetchOptional("flags", "/admin-api/feature-flags"),
          fetchOptional("health", "/admin-api/platform-health"),
          fetchOptional("audit", "/admin-api/audit-log"),
        ]);
        if (state.admin?.admin) state.admin = state.admin.admin;
        adminRoleEl.textContent = `${state.admin?.username || "admin"} - ${(state.admin?.role || "super_admin").replaceAll("_", " ")}`;
        setStatus("");
        render();
        restoreScrollPositions();
      }

      function renderNav() {
        navEl.innerHTML = views
          .map(([key, label], index) => {
            const title = index === 0 ? '<div class="nav-title">Main</div>' : "";
            const sectionTitle =
              key === "applications"
                ? '<div class="nav-title">Content</div>'
                : key === "users"
                  ? '<div class="nav-title">Users</div>'
                  : key === "discovery"
                    ? '<div class="nav-title">Discovery</div>'
                    : key === "settings"
                      ? '<div class="nav-title">System</div>'
                      : "";
            return `${title}${sectionTitle}<button class="${state.activeView === key ? "active" : "secondary"}" data-view="${key}" type="button">${label}</button>`;
          })
          .join("");
      }

      function setView(view) {
        state.activeView = view;
        state.editingArtistId = null;
        state.editingSongId = null;
        state.editingGenreId = null;
        render();
      }

      function render() {
        if (!state.token) {
          showLogin();
          return;
        }
        showAdmin();
        const isBoundedView = boundedViews.has(state.activeView);
        contentEl.classList.toggle("content-bounded", isBoundedView);
        viewEl.classList.toggle("split-view", isBoundedView);
        renderNav();
        const current = views.find(([key]) => key === state.activeView) || views[0];
        viewTitleEl.textContent = current[1];
        viewSubtitleEl.textContent = current[2];

        const renderers = {
          applications: renderApplications,
          artists: renderArtists,
          audit: renderAudit,
          catalog: renderCatalog,
          dashboard: renderDashboard,
          discovery: renderDiscovery,
          genres: renderGenres,
          health: renderHealth,
          releases: renderReleases,
          reports: renderReports,
          settings: renderSettings,
          users: renderUsers,
        };
        renderers[state.activeView]();
      }

      function rememberScrollPositions() {
        document.querySelectorAll("[data-scroll-key]").forEach((element) => {
          scrollMemory[element.dataset.scrollKey] = element.scrollTop;
        });
      }

      function restoreScrollPositions() {
        requestAnimationFrame(() => {
          document.querySelectorAll("[data-scroll-key]").forEach((element) => {
            const savedPosition = scrollMemory[element.dataset.scrollKey];
            if (typeof savedPosition === "number") {
              element.scrollTop = Math.min(savedPosition, element.scrollHeight);
            }
          });
        });
      }

      function renderPreservingScroll() {
        rememberScrollPositions();
        render();
        restoreScrollPositions();
      }

      function renderDashboard() {
        const metrics = state.dashboard || {};
        const cards = [
          ["Total Users", metrics.total_users],
          ["Approved Artists", metrics.total_approved_artists],
          ["Pending Applications", metrics.pending_artist_applications],
          ["Published Songs", metrics.total_published_songs],
          ["Releases Under Review", metrics.releases_under_review],
          ["Total Plays", metrics.total_streams],
          ["New Users (7d)", metrics.new_users_7d],
          ["New Releases (7d)", metrics.new_releases_7d],
          ["Reports Needing Attention", metrics.reports_requiring_attention],
        ];
        viewEl.innerHTML = `
          <div class="stats">
            ${cards
              .filter(([, value]) => value !== undefined && value !== null)
              .map(([label, value]) => `
                <div class="stat">
                  <p class="muted">${label}</p>
                  <div class="stat-value">${number(value)}</div>
                </div>`)
              .join("")}
          </div>
          <div class="grid three">
            ${quickCard("Review Artist Applications", "applications")}
            ${quickCard("Review Releases", "releases")}
            ${quickCard("Manage Catalog", "catalog")}
            ${quickCard("Manage Users", "users")}
            ${quickCard("Platform Settings", "settings")}
            ${quickCard("Platform Health", "health")}
          </div>
          ${state.health?.warnings?.length ? `
            <section class="panel">
              <h2>Storage Warning</h2>
              <p class="details">${state.health.warnings.map(escapeHtml).join("<br />")}</p>
            </section>` : ""}
        `;
      }

      function quickCard(label, view) {
        return `
          <section class="panel">
            <h2>${label}</h2>
            <p class="subtitle">Open this operational area.</p>
            <div class="actions" style="margin-top: 12px;">
              <button data-view="${view}" type="button">Open</button>
            </div>
          </section>`;
      }

      function renderApplications() {
        const rows = state.applications.filter((application) =>
          !state.filters.applicationStatus || application.status === state.filters.applicationStatus,
        );
        viewEl.innerHTML = `
          <section class="panel">
            <div class="toolbar">
              <h2>Artist Applications</h2>
              ${select("applicationStatus", state.filters.applicationStatus, ["", ...applicationStatuses], "All statuses")}
            </div>
            <div class="list" style="margin-top: 12px;">
              ${rows.length ? rows.map(applicationItem).join("") : '<p class="empty">No artist applications match this filter.</p>'}
            </div>
          </section>`;
      }

      function applicationItem(application) {
        const canAct = ["pending", "changes_requested"].includes(application.status);
        return `
          <article class="item">
            <img class="thumb" src="${escapeHtml(application.photo)}" alt="" />
            <div>
              <div class="item-title">${escapeHtml(application.artist_name || "Unnamed artist")}</div>
              <div class="meta">
                Applicant: ${escapeHtml(application.applicant?.name || "Listener")} |
                ${escapeHtml(application.genre || "Genre")} |
                ${escapeHtml([application.region, application.country].filter(Boolean).join(", "))}
              </div>
              <div class="details">
                ${badge(application.status)}<br />
                Contact: ${escapeHtml(application.contact_name)} | ${escapeHtml(application.email)} | ${escapeHtml(application.phone)}<br />
                Applied: ${formatDate(application.created_at)}<br />
                ${escapeHtml(application.bio)}
                ${application.review_reason || application.rejection_reason ? `<br />Reason: ${escapeHtml(application.review_reason || application.rejection_reason)}` : ""}
              </div>
            </div>
            <div class="actions">
              ${canAct ? `
                <button data-action="approve-application" data-id="${application.id}" type="button">Approve</button>
                <button class="secondary" data-action="changes-application" data-id="${application.id}" type="button">Request changes</button>
                <button class="danger" data-action="reject-application" data-id="${application.id}" type="button">Reject</button>` : ""}
            </div>
          </article>`;
      }

      function renderReleases() {
        const rows = state.releases.filter((release) =>
          !state.filters.releaseStatus || release.status === state.filters.releaseStatus,
        );
        viewEl.innerHTML = `
          <section class="panel">
            <div class="toolbar">
              <h2>Release Review</h2>
              ${select("releaseStatus", state.filters.releaseStatus, ["", ...releaseStatuses], "All statuses")}
            </div>
            <p class="subtitle" style="margin-top: 8px;">Use the audio control to listen to the complete upload before approval.</p>

      async function saveSettings(event) {
        event.preventDefault();
        const form = event.currentTarget;
        const data = new FormData(form);
        const previous = state.settings || {};
        const nextMaintenance = form.elements.maintenance_mode.checked;
        const nextRegistration = form.elements.registration_enabled.checked;

        if (!nextRegistration && previous.registration_enabled) {
          if (!confirm("Disable new user registration? Existing users can still login.")) return;
        }
        if (nextMaintenance && !previous.maintenance_mode) {
          if (!confirm("Enable maintenance mode for normal app users? Admin access will remain available.")) return;
        }

        const body = {
          registration_enabled: nextRegistration,
          artist_applications_enabled: form.elements.artist_applications_enabled.checked,
          music_uploads_enabled: form.elements.music_uploads_enabled.checked,
          maintenance_mode: nextMaintenance,
          max_audio_upload_mb: Number(data.get("max_audio_upload_mb") || 80),
          max_artwork_upload_mb: Number(data.get("max_artwork_upload_mb") || 10),
          supported_audio_formats: String(data.get("supported_audio_formats") || "")
            .split(",")
            .map((item) => item.trim())
            .filter(Boolean),
          minimum_supported_app_version: data.get("minimum_supported_app_version") || "",
          maintenance_message: data.get("maintenance_message") || "",
          app_announcement: data.get("app_announcement") || "",
          feature_flags: {
            artist_studio_enabled: form.elements.artist_studio_enabled.checked,
            offline_downloads_enabled: form.elements.offline_downloads_enabled.checked,
            playlists_enabled: form.elements.playlists_enabled.checked,
            registrations_enabled: nextRegistration,
            sharing_enabled: form.elements.sharing_enabled.checked,
          },
        };
        setStatus("Saving settings...");
        state.settings = await api("/admin-api/platform-settings", {
          method: "PUT",
          body: JSON.stringify(body),
        });
        await loadData();
        setStatus("Settings saved.");
      }

      async function runAction(action, id, extra = {}) {
        const pathMap = {
          "approve-application": [`/admin-api/artist-applications/${id}/approve`, {}],
          "approve-release": [`/admin-api/releases/${id}/approve`, {}],
          "hide-song": [`/admin-api/songs/${id}/hide`, {}],
          "restore-song": [`/admin-api/songs/${id}/restore`, {}],
          "feature-song": [`/admin-api/songs/${id}/feature`, {}],
          "unfeature-song": [`/admin-api/songs/${id}/unfeature`, {}],
          "restore-artist": [`/admin-api/artists/${id}/restore`, {}],
          "feature-artist": [`/admin-api/artists/${id}/feature`, {}],
          "unfeature-artist": [`/admin-api/artists/${id}/unfeature`, {}],
          "restore-user": [`/admin-api/users/${id}/restore`, {}],
          "revoke-user-sessions": [`/admin-api/users/${id}/revoke-sessions`, {}],
          "activate-genre": [`/admin-api/genres/${id}/activate`, {}],
          "deactivate-genre": [`/admin-api/genres/${id}/deactivate`, {}],
        };
        const [path, body] = pathMap[action] || [];
        if (!path) return;
        await api(path, { method: "POST", body: JSON.stringify({ ...body, ...extra }) });
        await loadData();
      }

      async function handleAction(action, button) {
        const id = button.dataset.id;
        if (action === "cancel-artist") {
          state.editingArtistId = null;
          return renderPreservingScroll();
        }
        if (action === "cancel-song") {
          state.editingSongId = null;
          return renderPreservingScroll();
        }
        if (action === "cancel-genre") {
          state.editingGenreId = null;
          return renderPreservingScroll();
        }
        if (action === "edit-artist") {
          state.editingArtistId = Number(id);
          state.activeView = "artists";
          return renderPreservingScroll();
        }
        if (action === "edit-song") {
          state.editingSongId = Number(id);
          state.activeView = "catalog";
          return renderPreservingScroll();
        }
        if (action === "edit-genre") {
          state.editingGenreId = Number(id);
          state.activeView = "genres";
          return renderPreservingScroll();
        }
        if (action === "reject-application" || action === "changes-application") {
          const reason = prompt(action === "reject-application" ? "Why is this application rejected?" : "What should the applicant change?");
          if (!reason) return;
          const endpoint = action === "reject-application" ? "reject" : "request-changes";
          await api(`/admin-api/artist-applications/${id}/${endpoint}`, {
            method: "POST",
            body: JSON.stringify({ reason }),
          });
          return loadData();
        }
        if (action === "reject-release" || action === "changes-release") {
          const reason = prompt(action === "reject-release" ? "Why is this release rejected?" : "What should the artist change?");
          if (!reason) return;
          const endpoint = action === "reject-release" ? "reject" : "request-changes";
          await api(`/admin-api/releases/${id}/${endpoint}`, {
            method: "POST",
            body: JSON.stringify({ reason }),
          });
          return loadData();
        }
        if (action === "remove-song") {
          const reason = prompt("Why should this song be removed from public availability?");
          if (!reason) return;
          await api(`/admin-api/songs/${id}/remove`, {
            method: "POST",
            body: JSON.stringify({ reason }),
          });
          return loadData();
        }
        if (action === "suspend-artist" || action === "suspend-user") {
          const reason = prompt("Enter a suspension reason.");
          if (!reason) return;
          const path = action === "suspend-artist" ? `/admin-api/artists/${id}/suspend` : `/admin-api/users/${id}/suspend`;
          await api(path, { method: "POST", body: JSON.stringify({ reason }) });
          return loadData();
        }
        if (action === "report-status") {
          const notes = prompt("Optional moderation note") || "";
          await api(`/admin-api/reports/${id}/status`, {
            method: "POST",
            body: JSON.stringify({ notes, status: button.dataset.status }),
          });
          return loadData();
        }
        if (action === "refresh-health") {
          state.health = await api("/admin-api/platform-health");
          return render();
        }
        if (action === "refresh-audit") {
          state.audit = await api("/admin-api/audit-log");
          return render();
        }
        if (action === "approve-application" && !confirm("Approve this artist application?")) return;
        if (action === "approve-release" && !confirm("Approve this release after listening?")) return;
        await runAction(action, id);
      }

      document.getElementById("loginForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        loginStatusEl.textContent = "Signing in...";
        try {
          const data = await api("/admin-api/login", {
            method: "POST",
            body: JSON.stringify({
              username: document.getElementById("loginUsername").value,
              password: document.getElementById("loginPassword").value,
            }),
          });
          state.token = data.token;
          state.admin = { role: data.role, username: data.username, permissions: data.permissions };
          localStorage.setItem("tesoAdminToken", state.token);
          loginStatusEl.textContent = "";
          await loadData();
        } catch (error) {
          loginStatusEl.textContent = error.message;
        }
      });

      document.addEventListener("click", async (event) => {
        const viewButton = event.target.closest("[data-view]");
        if (viewButton) {
          setView(viewButton.dataset.view);
          return;
        }

        const actionButton = event.target.closest("[data-action]");
        if (actionButton) {
          try {
            actionButton.disabled = true;
            setStatus("Working...");
            await handleAction(actionButton.dataset.action, actionButton);
            setStatus("");
          } catch (error) {
            setStatus(error.message);
          } finally {
            actionButton.disabled = false;
          }
        }
      });

      document.addEventListener("input", (event) => {
        const filter = event.target.dataset.filter;
        if (!filter) return;
        state.filters[filter] = event.target.value;
        renderPreservingScroll();
      });

      document.addEventListener("change", (event) => {
        const filter = event.target.dataset.filter;
        if (!filter) return;
        state.filters[filter] = event.target.value;
        renderPreservingScroll();
      });

      document.addEventListener("submit", async (event) => {
        try {
          if (event.target.id === "artistForm") await saveArtist(event);
          if (event.target.id === "songForm") await saveSong(event);
          if (event.target.id === "genreForm") await saveGenre(event);
          if (event.target.id === "settingsForm") await saveSettings(event);
        } catch (error) {
          event.preventDefault();
          setStatus(error.message);
        }
      });

      document.getElementById("refreshButton").addEventListener("click", () => {
        loadData().catch((error) => setStatus(error.message));
      });

      document.getElementById("logoutButton").addEventListener("click", () => {
        state.token = "";
        localStorage.removeItem("tesoAdminToken");
        showLogin();
      });

      if (state.token) {
        loadData().catch((error) => {
          state.token = "";
          localStorage.removeItem("tesoAdminToken");
          showLogin();
          loginStatusEl.textContent = error.message;
        });
      } else {
        render();
      }
    </script>
  </body>
</html>
