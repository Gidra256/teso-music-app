<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TesoHub Music Admin Console</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #08090b;
        --surface: #101114;
        --card: #15161b;
        --elevated: #202228;
        --border: #303139;
        --primary: #20e6f3;
        --accent: #f427c8;
        --success: #6cdeb0;
        --danger: #ff8196;
        --warning: #ffcf70;
        --text: #f5f5f7;
        --soft: #d8d8e2;
        --muted: #a4a5b1;
      }
      * { box-sizing: border-box; letter-spacing: 0; }
      body { background: var(--bg); color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; font-size: 14px; line-height: 1.5; }
      button, input, select, textarea { font: inherit; min-width: 0; }
      button { align-items: center; background: var(--primary); border: 1px solid transparent; border-radius: 6px; color: #031013; cursor: pointer; display: inline-flex; font-size: 13px; font-weight: 650; justify-content: center; min-height: 44px; padding: 10px 14px; max-width: 100%; overflow-wrap: anywhere; line-height: 1.4; }
      button.secondary { background: var(--elevated); border-color: var(--border); color: var(--soft); }
      button.ghost { background: transparent; border-color: var(--border); color: var(--soft); }
      button.danger { background: #361a23; border-color: #743544; color: var(--danger); }
      button.active { background: var(--primary); color: #031013; }
      button:hover:not(:disabled) { filter: brightness(1.12); }
      button:disabled { cursor: not-allowed; opacity: 0.55; }
      :focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
      input, select, textarea { background: var(--bg); border: 1px solid #45464f; border-radius: 6px; color: var(--text); min-height: 44px; padding: 10px 12px; width: 100%; }
      input[type="checkbox"] { min-height: 20px; width: 20px; accent-color: var(--primary); }
      input::placeholder, textarea::placeholder { color: var(--muted); opacity: 1; }
      input[type="file"] { padding: 8px; }
      label { color: var(--soft); display: grid; font-size: 13px; font-weight: 550; gap: 7px; min-width: 0; }
      label:has(input[type="checkbox"]) { display: flex; align-items: center; min-height: 44px; }
      textarea { min-height: 112px; resize: vertical; }
      h1, h2, h3, p { margin: 0; overflow-wrap: anywhere; }
      h1 { font-size: 26px; font-weight: 700; line-height: 1.2; }
      h2 { font-size: 18px; font-weight: 650; line-height: 1.4; }
      h3 { font-size: 14px; font-weight: 650; }
      a { color: var(--primary); }
      .login { margin: 8vh auto 0; max-width: 460px; padding: 24px; }
      .login .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 24px; }
      .login h1 { font-size: 23px; }
      .login .brand { margin-bottom: 12px; }
      .shell { display: grid; grid-template-columns: 238px minmax(0, 1fr); min-height: 100vh; }
      .sidebar { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 16px; padding: 20px 12px; position: sticky; top: 0; height: 100vh; height: 100dvh; min-width: 0; }
      .brand { align-items: center; display: flex; gap: 10px; min-width: 0; }
      .brand > div { min-width: 0; }
      .sidebar .brand { padding: 0 4px; }
      .logo { background: #000; border-radius: 6px; height: 44px; object-fit: cover; width: 44px; flex: 0 0 44px; }
      .brand-title { font-size: 15px; font-weight: 700; }
      .muted, .subtitle { color: var(--muted); font-size: 13px; line-height: 1.55; }
      .admin-identity { display: grid; gap: 6px; padding: 14px 8px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); min-width: 0; }
      .admin-name { font-size: 13px; font-weight: 650; color: var(--text); overflow-wrap: anywhere; }
      .role-badge { color: var(--primary); font-size: 12px; }
      .nav { display: grid; align-content: start; gap: 4px; overflow: auto; min-height: 0; flex: 1; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
      .nav-title { color: var(--muted); font-size: 11px; font-weight: 600; margin: 14px 10px 5px; text-transform: uppercase; }
      .nav-title:first-child { margin-top: 0; }
      .nav button { justify-content: flex-start; min-height: 44px; width: 100%; font-weight: 500; background: transparent; border-color: transparent; color: var(--muted); text-align: left; }
      .nav button.active { background: #143034; color: var(--primary); border-color: #235158; box-shadow: inset 3px 0 var(--primary); font-weight: 650; }
      .sidebar-actions { display: grid; grid-template-columns: 1fr auto; gap: 6px; border-top: 1px solid var(--border); padding-top: 12px; }
      .sidebar-actions button { padding: 8px 10px; font-size: 12px; }
      .content { display: grid; align-content: start; grid-template-rows: auto 1fr; gap: 24px; min-width: 0; padding: 28px 28px 32px; }
      .content.content-bounded { grid-template-rows: auto minmax(0, 1fr); height: 100vh; height: 100dvh; overflow: hidden; }
      .topbar { align-items: flex-start; display: flex; gap: 16px; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
      .topbar .subtitle { margin-top: 6px; }
      .topbar #status { max-width: 420px; }
      #view { min-width: 0; display: grid; align-content: start; gap: 24px; }
      .panel { min-width: 0; padding: 0; background: transparent; border: 0; border-radius: 0; }
      .panel > h2, .panel > .toolbar { margin-bottom: 16px; }
      .panel .panel { border-top: 1px solid var(--border); padding-top: 20px; }
      .grid { display: grid; gap: 24px; min-width: 0; }
      .grid.two { grid-template-columns: minmax(240px, 0.85fr) minmax(0, 1.45fr); }
      .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
      .stats { display: grid; gap: 12px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .stat { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 18px; min-width: 0; }
      .stat-value { font-size: 30px; font-weight: 650; line-height: 1.3; margin-top: 12px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
      .shortcut { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; color: var(--soft); justify-content: space-between; text-align: left; min-height: 60px; gap: 16px; padding: 16px; }
      .shortcut span:last-child { color: var(--primary); }
      .section-heading { margin-bottom: 12px; }
      .form { display: grid; gap: 16px; min-width: 0; }
      .form-row { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .toolbar, .actions { align-items: center; display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; }
      .toolbar { justify-content: space-between; }
      .toolbar > input { flex: 1 1 180px; }
      .toolbar > select { flex: 1 1 130px; width: auto; }
      .list { display: grid; align-content: start; gap: 0; min-width: 0; }
      .paged-collection { min-width: 0; }
      .page-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 12px 0; border-bottom: 1px solid var(--border); }
      .page-controls .meta { margin: 0; flex: 1 1 140px; }
      .item .meta, .item .item-title { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
      .item .details { margin-top: 5px; }
      .item { padding: 10px 0; gap: 10px; }
      .item audio { width: 280px; }
      .item details { grid-column: 1 / -1; }
      .item details .actions { padding-bottom: 4px; }
      .split-panel .item { grid-template-columns: 40px minmax(0, 1fr); }
      .split-panel .thumb { width: 40px; height: 40px; }
      .content.content-bounded #view, .split-dashboard, .split-panel { min-height: 0; }
      .split-dashboard { height: 100%; }
      .split-panel { display: flex; flex-direction: column; max-height: 100%; overflow: hidden; }
      .split-form-panel { overflow: auto; overscroll-behavior: contain; padding-right: 12px; }
      .split-list-header { flex: 0 0 auto; padding-bottom: 16px; }
      .split-list-header + .scroll-region { border-top: 1px solid var(--border); }
      .scroll-region { min-height: 0; overflow: auto; overscroll-behavior: contain; padding-right: 8px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
      .item { align-items: start; border-bottom: 1px solid var(--border); display: grid; gap: 14px; grid-template-columns: 56px minmax(0, 1fr) auto; padding: 18px 0; min-width: 0; }
      .thumb { background: var(--elevated); border-radius: 6px; height: 56px; object-fit: cover; width: 56px; }
      .item-title { font-size: 14px; font-weight: 650; overflow-wrap: anywhere; }
      .split-panel .item { grid-template-columns: 56px minmax(0, 1fr); }
      .split-panel .item .actions { grid-column: 2; }
      .meta { color: var(--muted); font-size: 12px; line-height: 1.6; margin-top: 5px; overflow-wrap: anywhere; }
      .details { color: var(--soft); font-size: 13px; line-height: 1.65; margin-top: 10px; overflow-wrap: anywhere; }
      .badge { background: #163137; border: 1px solid #28515a; border-radius: 4px; color: var(--primary); display: inline-flex; font-size: 11px; font-weight: 600; padding: 3px 7px; text-transform: capitalize; max-width: 100%; overflow-wrap: anywhere; }
      .badge.warn { background: #302819; border-color: #64502b; color: var(--warning); }
      .badge.danger { background: #361a23; border-color: #743544; color: var(--danger); }
      .badge.ok { background: #143025; border-color: #2a5845; color: var(--success); }
      .status-line { color: var(--accent); font-size: 13px; font-weight: 550; min-height: 0; overflow-wrap: anywhere; }
      .status-line:empty { display: none; }
      .empty { color: var(--muted); padding: 32px 12px; border: 1px dashed var(--border); border-radius: 6px; margin: 12px 0; text-align: center; }
      [role="alert"] { border-left: 3px solid var(--danger); padding: 16px; background: #24141a; }
      [role="alert"] button { margin-top: 12px; }
      audio { margin-top: 10px; max-width: 100%; width: 420px; min-width: 0; }
      .hidden, [hidden] { display: none !important; }
      .applications-workspace { min-width: 0; align-self: start; }
      .application-filters { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) auto; gap: 12px; align-items: end; margin: 20px 0; }
      .application-filters:has([data-filter="releasePublication"]) { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr) auto; }
      .application-fields { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 28px; margin: 24px 0; border-top: 1px solid var(--border); }
      .application-fields div { min-width: 0; border-bottom: 1px solid var(--border); padding: 14px 0; }
      .application-fields dt { color: var(--muted); font-size: 12px; margin-bottom: 5px; }
      .application-fields dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; }
      .application-history { padding-left: 20px; margin-bottom: 28px; }
      .application-history li { margin-bottom: 14px; overflow-wrap: anywhere; padding-left: 8px; }
      .application-history li::marker { color: var(--primary); }
      .review-identity { display: flex; align-items: center; gap: 20px; padding: 24px 0; flex-wrap: wrap; }
      .review-identity > div { min-width: 0; flex: 1 1 180px; }
      .review-identity h2 { font-size: 22px; }
      .review-identity .thumb, .release-artwork { display: block; width: 112px; height: 112px; max-width: 100%; aspect-ratio: 1; border-radius: 6px; object-fit: contain; background: #000; }
      .review-decision { border-top: 1px solid var(--border); padding-top: 24px; margin-top: 24px; }
      .review-decision h3 { margin-bottom: 12px; }
      .admin-layout { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(240px, 0.8fr); gap: 28px; align-items: start; }
      .admin-create { grid-column: 2; grid-row: 1; }
      .admin-list { grid-column: 1; grid-row: 1; display: grid; gap: 24px; min-width: 0; }
      .admin-account { border: 1px solid var(--border); border-radius: 6px; padding: 20px; background: var(--surface); min-width: 0; }
      .admin-account > .toolbar { align-items: start; }
      .admin-account .account-dates { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }
      .account-dates dt { font-size: 12px; color: var(--muted); }
      .account-dates dd { margin: 4px 0 0; font-size: 13px; }
      .account-access { border-top: 1px solid var(--border); margin-top: 20px; padding-top: 20px; }
      .account-access button { justify-self: start; }
      .security-actions { border-top: 1px solid #54313f; padding-top: 18px; margin-top: 20px; display: grid; gap: 14px; }
      .security-actions h3 { color: var(--danger); }
      details { min-width: 0; }
      summary { cursor: pointer; min-height: 44px; padding: 10px 0; color: var(--soft); }
      details[open] > summary { margin-bottom: 10px; }
      .security-form { max-width: 540px; }
      .support-public, .support-internal { padding-top: 20px; border-top: 1px solid var(--border); margin-top: 20px; }
      .support-internal { border-color: #6a385e; }
      .support-internal h3 { color: #ff98e6; }
      .application-history { padding-left: 0; }
      .item { padding: 10px 0; gap: 10px; }
      .history-entry { padding: 12px 0 12px 16px; border-left: 2px solid var(--border); border-bottom: 1px solid var(--border); }
      .split-panel .item { grid-template-columns: 40px minmax(0, 1fr) auto; }
      .split-panel .item .thumb { width: 40px; height: 40px; }
      .item .row-menu { grid-column: 3; width: 82px; }
      .row-menu summary { font-size: 12px; }
      .item .row-menu[open] { grid-column: 1 / -1; width: auto; }
      .row-menu[open] summary { color: var(--primary); }
      .page-controls button { min-width: 72px; }
      @media (min-width: 981px) and (max-width: 1199px) {
        .content { padding: 24px 20px; }
        .shell { grid-template-columns: 218px minmax(0, 1fr); }
        .thumb { height: 48px; width: 48px; }
        .admin-layout { grid-template-columns: minmax(0, 1fr); }
        .admin-create, .admin-list { grid-column: auto; grid-row: auto; }
        .application-filters:has([data-filter="releasePublication"]) { grid-template-columns: 1fr 1fr; }
      }
      @media (max-width: 980px) {
        .shell { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; }
        .sidebar { height: auto; position: static; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; border-right: 0; border-bottom: 1px solid var(--border); padding: 16px; }
        .admin-identity { border: 0; padding: 0; align-self: center; text-align: right; max-width: 240px; gap: 2px; }
        .sidebar-actions { grid-column: 1 / -1; display: flex; border: 0; padding: 0; order: 1; }
        .sidebar-actions button { min-height: 44px; }
        .nav { grid-column: 1 / -1; display: flex; overflow-x: auto; max-width: 100%; gap: 6px; padding: 3px 3px 7px; order: 2; }
        .nav-title { display: none; }
        .nav button { width: auto; flex: 0 0 auto; }
        .content, .content.content-bounded { height: auto; overflow: visible; padding: 24px; }
        .content.content-bounded #view, .split-dashboard { height: auto; overflow: visible; }
        .split-panel { max-height: none; overflow: visible; }
        .split-form-panel, .scroll-region { overflow: visible; padding-right: 0; }
        .grid.two { grid-template-columns: minmax(0, 1fr); }
        .grid.two > .panel + .panel { border-top: 1px solid var(--border); padding-top: 24px; }
        .admin-layout { grid-template-columns: minmax(0, 1fr); }
        .admin-create, .admin-list { grid-column: auto; grid-row: auto; }
      }
      @media (max-width: 680px) {
        .content, .content.content-bounded { padding: 20px 16px 32px; gap: 20px; }
        h1 { font-size: 23px; }
        .topbar, .toolbar { align-items: stretch; flex-direction: column; }
        .topbar { gap: 8px; padding-bottom: 16px; }
        .toolbar > input, .toolbar > select { flex: auto; width: 100%; }
        .sidebar .brand-title { font-size: 13px; }
        .sidebar .logo { width: 36px; height: 36px; flex-basis: 36px; }
        .admin-identity { max-width: 124px; }
        .admin-name { font-size: 12px; }
        .role-badge { font-size: 11px; }
        .item { grid-template-columns: 48px minmax(0, 1fr); gap: 12px; }
        .thumb { height: 48px; width: 48px; }
        .item .actions { grid-column: 1 / -1; }
        .form-row, .application-filters, .application-filters:has([data-filter="releasePublication"]), .application-fields { grid-template-columns: minmax(0, 1fr); }
        .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
        .stat { padding: 14px; }
        .stat-value { font-size: 26px; }
        .grid.three { grid-template-columns: minmax(0, 1fr); }
        .admin-account { padding: 16px; }
        .admin-account .account-dates { grid-template-columns: minmax(0, 1fr); }
        input, select, textarea { font-size: 16px; }
      }
      @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
    </style>
  </head>
  <body>
    <main id="loginPanel" class="login">
      <section class="panel">
        <form id="loginForm" class="form">
          <div class="brand">
            <img class="logo" src="/app-assets/images/tesohub-music.png" alt="" />
            <div>
              <h1>TesoHub Admin</h1>
              <p class="subtitle">Secure platform control centre</p>
            </div>
          </div>
          <label>Login identifier<input id="loginUsername" autocomplete="username" required /></label>
          <label>Password<input id="loginPassword" type="password" autocomplete="current-password" /></label>
          <label><input id="recoveryLogin" type="checkbox" /> Emergency break-glass recovery</label>
          <button type="submit">Sign in</button>
          <p id="loginStatus" class="status-line" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <main id="adminPanel" class="shell hidden">
      <aside class="sidebar">
        <div class="brand">
          <img class="logo" src="/app-assets/images/tesohub-music.png" alt="" />
          <div>
            <div class="brand-title">TesoHub Music</div>
            <p class="muted">Admin Console</p>
          </div>
        </div>
        <div id="adminRole" class="admin-identity">Admin Console V1</div>
        <nav class="nav" id="nav" aria-label="Admin sections"></nav>
        <div class="sidebar-actions">
        <button id="refreshButton" class="secondary" type="button">Refresh data</button>
        <button id="logoutButton" class="ghost" type="button">Logout</button>
        </div>
      </aside>

      <section class="content">
        <div class="topbar">
          <div>
            <h1 id="viewTitle">Dashboard</h1>
            <p id="viewSubtitle" class="subtitle">Real backend data only</p>
          </div>
          <p id="status" class="status-line" role="status" aria-live="polite"></p>
        </div>
        <section id="view"></section>
      </section>
    </main>

    <script>
      const categories = ["Rappers", "Other Secular Artists", "Gospel Artists"];
      const applicationStatuses = ["pending", "approved", "rejected", "changes_requested"];
      const releaseStatuses = ["under_review", "approved", "scheduled", "published", "rejected", "draft"];
      const songStatuses = ["published", "hidden", "removed", "under_review"];
      const userStatuses = ["active", "suspended"];
      const reportStatuses = ["open", "reviewing", "resolved", "dismissed"];
      const supportStatuses = ["open", "in_progress", "waiting_on_user", "resolved", "closed"];
      const supportPriorities = ["low", "normal", "high", "urgent"];
      const supportCategories = [
        "Account / Login",
        "Playback",
        "Playlist / Library",
        "App Bug",
        "Downloads",
        "Report Content",
        "Artist Application",
        "Upload Problem",
        "Release Review",
        "Metadata Correction",
        "Artist Profile",
        "Copyright / Ownership",
        "Analytics",
        "Other",
      ];
      const views = [
        ["dashboard", "Dashboard", "Control centre overview"],
        ["applications", "Artist Applications", "Review applicant artists"],
        ["releases", "Release Review", "Listen and approve uploaded songs"],
        ["catalog", "Music Catalog", "Manage published and hidden songs"],
        ["artists", "Artists", "Manage artist profiles and status"],
        ["users", "Users", "Support and account status"],
        ["support", "Support", "Tickets, replies, notes, and assignment"],
        ["reports", "Reports", "Moderation queue"],
        ["discovery", "Home & Discovery", "Curated featured content"],
        ["genres", "Genres", "Master genre list"],
        ["settings", "Platform Settings", "Operational switches and upload policy"],
        ["health", "Platform Health", "Backend and storage visibility"],
        ["audit", "Audit Log", "Admin activity history"],
        ["admins", "Admin Management", "Staff accounts and access"],
        ["security", "Account Security", "Change your Admin password"],
      ];

      const state = {
        activeView: "dashboard",
        admin: null,
        // Request generation only, not a credential. Authentication is HttpOnly.
        token: "cookie-session",
        admins: [],
        dashboard: null,
        artists: [],
        songs: [],
        applications: [],
        activeApplicationId: null,
        applicationDetail: null,
        applicationDetailState: "idle",
        applicationDetailError: "",
        releases: [],
        activeReleaseId: null,
        releaseDetail: null,
        releaseDetailState: "idle",
        releaseDetailError: "",
        users: [],
        supportTickets: [],
        activeSupportTicket: null,
        reports: [],
        genres: [],
        settings: null,
        flags: {},
        health: null,
        audit: [],
        loads: {},
        editingArtistId: null,
        editingSongId: null,
        editingGenreId: null,
        filters: {
          applicationStatus: "",
          applicationSearch: "",
          releaseStatus: "",
          releaseSearch: "",
          releasePublication: "",
          catalogSearch: "",
          catalogStatus: "",
          userSearch: "",
          userRole: "",
          userStatus: "",
          supportCategory: "",
          supportSearch: "",
          supportStatus: "",
          reportStatus: "",
        },
      };

      const loginPanel = document.getElementById("loginPanel");
      const adminPanel = document.getElementById("adminPanel");
      const loginStatusEl = document.getElementById("loginStatus");
      const statusEl = document.getElementById("status");
      const contentEl = document.querySelector(".content");
      const viewEl = document.getElementById("view");
      const viewTitleEl = document.getElementById("viewTitle");
      const viewSubtitleEl = document.getElementById("viewSubtitle");
      const navEl = document.getElementById("nav");
      const adminRoleEl = document.getElementById("adminRole");
      const boundedViews = new Set(["artists", "catalog", "discovery", "genres"]);
      const scrollMemory = {};
      const listPages = new Map();
      const listPageSize = 25;

      function pagedList(key, rows, item, empty = '<p class="empty">No records yet.</p>', signature = JSON.stringify(state.filters)) {
        const previous = listPages.get(key);
        const page = previous?.signature === signature ? previous.page : 0;
        const entry = {rows, item, empty, signature, page: Math.min(page, Math.max(0, Math.ceil(rows.length / listPageSize) - 1))};
        listPages.set(key, entry);
        return `<div class="paged-collection" data-page-list="${key}">${pageContents(key, entry)}</div>`;
      }

      function pageContents(key, entry) {
        const {rows, item, empty, page} = entry;
        if (!rows.length) return empty;
        const start = page * listPageSize, end = Math.min(start + listPageSize, rows.length);
        const controls = rows.length > listPageSize ? `<nav class="page-controls" aria-label="${key.replaceAll("-", " ")} pages">
          <p class="meta" role="status">${start + 1}-${end} of ${number(rows.length)}</p>
          <button class="secondary" type="button" data-page-key="${key}" data-page-step="-1" ${page === 0 ? "disabled" : ""}>Previous</button>
          <button class="secondary" type="button" data-page-key="${key}" data-page-step="1" ${end >= rows.length ? "disabled" : ""}>Next</button>
          </nav>` : "";
        return controls + rows.slice(start, end).map(item).join("");
      }

      function changeListPage(button) {
        const key = button.dataset.pageKey, entry = listPages.get(key);
        if (!entry) return;
        entry.page = Math.max(0, Math.min(entry.page + Number(button.dataset.pageStep), Math.ceil(entry.rows.length / listPageSize) - 1));
        const region = document.querySelector(`[data-page-list="${key}"]`);
        if (!region) return;
        region.innerHTML = pageContents(key, entry);
        region.closest(".scroll-region")?.scrollTo({top: 0});
        const controls = region.querySelector(".page-controls");
        controls?.scrollIntoView({block:"nearest"});
        (region.querySelector(`[data-page-step="${button.dataset.pageStep}"]:not(:disabled)`) || region.querySelector(".page-controls button:not(:disabled)"))?.focus({preventScroll:true});
      }
      const viewPermissions = {
        dashboard: ["artists", "catalog", "releases", "reports"],
        applications: ["applications"], releases: ["releases"], catalog: ["catalog"],
        artists: ["artists"], users: ["users"], support: ["support:view"],
        reports: ["reports"], discovery: ["discovery"], genres: ["genres"],
        settings: ["settings"], health: ["*"], audit: ["*"], admins: ["*"], security: [],
      };

      function can(permission) {
        const permissions = state.admin?.permissions || [];
        return permissions.includes("*") || permissions.includes(permission);
      }

      function canView(view) {
        if (view === "security") return state.admin?.auth_type === "individual";
        return (viewPermissions[view] || []).some(can);
      }

      function sourcesForView(view) {
        return (viewSources[view] || []).filter((key) => key !== "health" || can("*"));
      }

      function setStatus(message) {
        statusEl.textContent = message || "";
      }

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function formatDate(value) {
        if (!value) return "No date";
        return String(value).slice(0, 10);
      }

      function number(value) {
        return Number(value || 0).toLocaleString();
      }

      function badge(value) {
        const status = String(value || "unknown");
        const tone = ["approved", "published", "active", "resolved"].includes(status)
          ? "ok"
          : ["rejected", "removed", "suspended", "dismissed", "disabled"].includes(status)
            ? "danger"
            : ["pending", "under_review", "scheduled", "reviewing", "hidden"].includes(status)
              ? "warn"
              : "";
        return `<span class="badge ${tone}">${escapeHtml(status.replaceAll("_", " "))}</span>`;
      }

      function showLogin() {
        state.activeReleaseId = null;
        state.releaseDetail = null;
        state.activeApplicationId = null;
        state.applicationDetail = null;
        adminPanel.classList.add("hidden");
        loginPanel.classList.remove("hidden");
      }

      function showAdmin() {
        loginPanel.classList.add("hidden");
        adminPanel.classList.remove("hidden");
      }

      async function api(path, options = {}) {
        const { suppressForbiddenLogout, ...fetchOptions } = options;
        const headers = {
          ...(options.body instanceof FormData ? {} : { "Content-Type": "application/json" }),
          "X-Teso-Admin": "1",
          ...(options.headers || {}),
        };
        const response = await fetch(path, { ...fetchOptions, credentials: "same-origin", headers });
        const text = await response.text();
        let data;
        try {
          data = text ? JSON.parse(text) : null;
        } catch (error) {
          const responseError = new Error(`Could not read the server response (${response.status}). Please retry.`);
          responseError.status = response.status;
          throw responseError;
        }

        if (!response.ok) {
          const message = response.status === 403 ? "You do not have permission to perform this action." :
            data?.detail || `Request failed (${response.status})`;
          if ([401, 403].includes(response.status) && path === "/admin-api/me" && !suppressForbiddenLogout) {
            localStorage.removeItem("tesoAdminToken");
            state.token = "";
            showLogin();
          }
          const error = new Error(message);
          error.status = response.status;
          throw error;
        }
        return data;
      }

      const dataSources = {
        admin: "/admin-api/me",
        dashboard: "/admin-api/dashboard",
        artists: "/admin-api/artists",
        songs: "/admin-api/songs",
        applications: "/admin-api/artist-applications",
        releases: "/admin-api/releases",
        users: "/admin-api/users",
        supportTickets: "/admin-api/support/tickets",
        reports: "/admin-api/reports",
        genres: "/admin-api/genres",
        settings: "/admin-api/platform-settings",
        flags: "/admin-api/feature-flags",
        health: "/admin-api/platform-health",
        audit: "/admin-api/audit-log",
        admins: "/admin-api/admin-accounts",
      };
      const viewSources = {
        dashboard: ["dashboard", "health"],
        applications: ["applications"],
        releases: ["releases"],
        catalog: ["songs", "artists", "genres"],
        artists: ["artists"],
        users: ["users"],
        support: ["supportTickets"],
        reports: ["reports"],
        discovery: ["artists", "songs"],
        genres: ["genres"],
        settings: ["settings", "flags"],
        health: ["health"],
        audit: ["audit"],
        admins: ["admins"], security: [],
      };
      const arraySources = new Set([
        "artists", "songs", "applications", "releases", "users",
        "supportTickets", "reports", "genres", "audit", "admins",
      ]);
      const pendingLoads = new Map();
      const pendingApplicationRefreshes = new Map();
      let readQueue = Promise.resolve();

      function loadResource(key, { force = false } = {}) {
        const requestedToken = state.token;
        const pendingKey = `${requestedToken}:${key}`;
        if (pendingLoads.has(pendingKey)) {
          // Refresh requested during an older read must observe submissions made
          // after that read began, without issuing parallel/duplicate refreshes.
          if (["applications", "releases"].includes(key) && force) {
            if (!pendingApplicationRefreshes.has(pendingKey)) {
              const refresh = pendingLoads.get(pendingKey).then(() => {
                pendingApplicationRefreshes.delete(pendingKey);
                if (requestedToken === state.token) return loadResource(key, {force:true});
              });
              pendingApplicationRefreshes.set(pendingKey, refresh);
            }
            return pendingApplicationRefreshes.get(pendingKey);
          }
          return pendingLoads.get(pendingKey);
        }
        if (!force && state.loads[key]?.status === "ready") return Promise.resolve();
        state.loads[key] = { status: "loading" };
        // Serialize reads across views, including rapid navigation and retries.
        const job = readQueue.then(async () => {
          if (!requestedToken || requestedToken !== state.token) {
            pendingLoads.delete(pendingKey);
            return;
          }
          try {
            const data = await api(dataSources[key], {
              cache: "no-store",
              suppressForbiddenLogout: true,
              signal: AbortSignal.timeout(45000),
            });
            if (requestedToken !== state.token) return;
            if (arraySources.has(key) ? !Array.isArray(data) : !data || typeof data !== "object" || Array.isArray(data)) {
              throw new Error("The server returned unexpected data. Please retry.");
            }
            if (key === "admin" && !data.admin) {
              throw new Error("Could not verify your admin session. Please retry.");
            }
            state[key] = key === "admin" ? data.admin : data;
            state.loads[key] = { status: "ready" };
            if (key === "admin") {
              adminRoleEl.textContent = `${state.admin.display_name || state.admin.username} - ${state.admin.role.replaceAll("_", " ")}`;
              if (!canView(state.activeView)) {
                state.activeView = views.find(([view]) => canView(view))?.[0] || "dashboard";
              }
            }
          } catch (error) {
            if (requestedToken !== state.token) return;
            if (key === "admin" && [401, 403].includes(error.status)) {
              localStorage.removeItem("tesoAdminToken");
              state.token = "";
              loginStatusEl.textContent = "Your session has expired. Please sign in again.";
              showLogin();
              return;
            }
            state.loads[key] = {
              status: "error",
              forbidden: error.status === 403,
              message: error.status === 403 ? "Your account does not have access to this section." : error.message,
            };
          } finally {
            pendingLoads.delete(pendingKey);
            if (requestedToken === state.token && (key === "admin" || viewSources[state.activeView].includes(key))) {
              renderPreservingScroll();
            }
          }
        });
        pendingLoads.set(pendingKey, job);
        readQueue = job.catch(() => {});
        return job;
      }

      async function loadView(view, { force = false } = {}) {
        if (!state.token) return;
        if (state.loads.admin?.status !== "ready") await loadResource("admin");
        if (!state.token || state.loads.admin?.status !== "ready") return;
        if (!canView(view)) return setStatus("You do not have permission to open this section.");
        const keys = ["admin", ...sourcesForView(view)];
        const jobs = keys.map((key) => loadResource(key, { force: force && key !== "admin" }));
        renderPreservingScroll();
        await Promise.all(jobs);
      }

      async function loadData() {
        if (!state.token) return;
        // Mutations and explicit refreshes invalidate data in other views too.
        for (const [key, load] of Object.entries(state.loads)) {
          if (load.status !== "loading") state.loads[key] = { status: "idle" };
        }
        const identity = loadResource("admin", { force: true });
        renderPreservingScroll();
        await identity;
        if (state.token && state.loads.admin?.status === "ready") {
          await loadView(state.activeView, { force: true });
        }
      }

      function renderLoadState() {
        const keys = ["admin", ...sourcesForView(state.activeView)];
        const failed = keys.filter((key) => state.loads[key]?.status === "error");
        const loading = keys.some((key) => ["idle", "loading"].includes(state.loads[key]?.status || "idle"));
        const busy = keys.some((key) => state.loads[key]?.status === "loading");
        if (failed.length) {
          const forbidden = failed.some((key) => state.loads[key].forbidden);
          setStatus("Could not load this section.");
          viewEl.innerHTML = `<section class="panel" role="alert">
            <h2>${forbidden ? "Permission denied" : `Could not load ${escapeHtml(viewTitleEl.textContent)}`}</h2>
            <p class="details">${failed.map((key) => escapeHtml(state.loads[key].message)).join("<br />")}</p>
            <button data-action="retry-data" type="button" ${busy ? "disabled" : ""}>Retry</button>
          </section>`;
          return true;
        }
        if (loading) {
          setStatus("Loading admin data...");
          viewEl.innerHTML = `<section class="panel" role="status" aria-live="polite">
            <p class="details">Loading ${escapeHtml(viewTitleEl.textContent)}...</p>
          </section>`;
          return true;
        }
        setStatus("");
        return false;
      }

      function renderNav() {
        const scrollTop = navEl.scrollTop || 0, scrollLeft = navEl.scrollLeft || 0;
        if (state.admin) {
          adminRoleEl.innerHTML = `<span class="admin-name">${escapeHtml(state.admin.display_name || state.admin.username)}</span><span class="role-badge">${escapeHtml(adminRoleLabel(state.admin.role))}</span>`;
        }
        navEl.innerHTML = views
          .filter(([key]) => canView(key))
          .map(([key, label], index) => {
            const title = index === 0 ? '<div class="nav-title">Main</div>' : "";
            const sectionTitle =
              key === "applications"
                ? '<div class="nav-title">Content</div>'
                : key === "users"
                  ? '<div class="nav-title">Users</div>'
                  : key === "discovery"
                    ? '<div class="nav-title">Discovery</div>'
                    : key === "settings"
                      ? '<div class="nav-title">System</div>'
                      : "";
            return `${title}${sectionTitle}<button class="${state.activeView === key ? "active" : "secondary"}" ${state.activeView === key ? 'aria-current="page"' : ""} data-view="${key}" type="button">${label}</button>`;
          })
          .join("");
        navEl.scrollTop = scrollTop;
        navEl.scrollLeft = scrollLeft;
        const active = navEl.querySelector?.('[aria-current="page"]');
        if (active) {
          // Scroll only the navigation region, never the review/form underneath it.
          const item = active.getBoundingClientRect(), region = navEl.getBoundingClientRect();
          if (item.top < region.top) navEl.scrollTop += item.top - region.top;
          else if (item.bottom > region.bottom) navEl.scrollTop += item.bottom - region.bottom;
          if (item.left < region.left) navEl.scrollLeft += item.left - region.left;
          else if (item.right > region.right) navEl.scrollLeft += item.right - region.right;
        }
      }

      function setView(view) {
        if (!canView(view)) return setStatus("You do not have permission to open this section.");
        state.activeView = view;
        state.editingArtistId = null;
        state.editingSongId = null;
        state.editingGenreId = null;
        if (view === "applications") state.activeApplicationId = null;
        if (view === "releases") state.activeReleaseId = null;
        loadView(view, { force: ["applications", "releases"].includes(view) }).catch((error) => setStatus(error.message));
      }

      function render() {
        if (!state.token) {
          showLogin();
          return;
        }
        showAdmin();
        adminPanel.classList.toggle("applications-active", ["applications", "releases"].includes(state.activeView));
        const isBoundedView = boundedViews.has(state.activeView);
        contentEl.classList.toggle("content-bounded", isBoundedView);
        viewEl.classList.toggle("split-view", isBoundedView);
        renderNav();
        const current = views.find(([key]) => key === state.activeView) || views[0];
        viewTitleEl.textContent = current[1];
        viewSubtitleEl.textContent = current[2];
        if (renderLoadState()) return;
        if (!canView(state.activeView)) {
          viewEl.innerHTML = '<p class="details">You do not have permission to open this section.</p>';
          return;
        }

        const renderers = {
          applications: renderApplications,
          artists: renderArtists,
          audit: renderAudit,
          admins: renderAdmins,
          security: renderSecurity,
          catalog: renderCatalog,
          dashboard: renderDashboard,
          discovery: renderDiscovery,
          genres: renderGenres,
          health: renderHealth,
          releases: renderReleases,
          reports: renderReports,
          settings: renderSettings,
          support: renderSupport,
          users: renderUsers,
        };
        renderers[state.activeView]();
      }

      function rememberScrollPositions() {
        document.querySelectorAll("[data-scroll-key]").forEach((element) => {
          scrollMemory[element.dataset.scrollKey] = element.scrollTop;
        });
      }

      function restoreScrollPositions() {
        requestAnimationFrame(() => {
          document.querySelectorAll("[data-scroll-key]").forEach((element) => {
            const savedPosition = scrollMemory[element.dataset.scrollKey];
            if (typeof savedPosition === "number") {
              element.scrollTop = Math.min(savedPosition, element.scrollHeight);
            }
          });
        });
      }

      function renderPreservingScroll() {
        const focused = document.activeElement;
        const filter = focused?.dataset?.filter;
        const selection = filter ? [focused.selectionStart, focused.selectionEnd] : null;
        rememberScrollPositions();
        render();
        restoreScrollPositions();
        if (filter) {
          const replacement = document.querySelector(`[data-filter="${filter}"]`);
          replacement?.focus({ preventScroll: true });
          if (selection[0] !== null && typeof selection[0] === "number") replacement?.setSelectionRange(...selection);
        }
      }

      function renderDashboard() {
        const metrics = state.dashboard || {};
        const cards = [
          ["Total Users", metrics.total_users],
          ["Approved Artists", metrics.total_approved_artists],
          ["Pending Applications", metrics.pending_artist_applications],
          ["Published Songs", metrics.total_published_songs],
          ["Releases Under Review", metrics.releases_under_review],
          ["Total Plays", metrics.total_streams],
          ["New Users (7d)", metrics.new_users_7d],
          ["New Releases (7d)", metrics.new_releases_7d],
          ["Reports Needing Attention", metrics.reports_requiring_attention],
        ];
        viewEl.innerHTML = `
          <div class="stats">
            ${cards
              .filter(([, value]) => value !== undefined && value !== null)
              .map(([label, value]) => `
                <div class="stat">
                  <p class="muted">${label}</p>
                  <div class="stat-value">${number(value)}</div>
                </div>`)
              .join("")}
          </div>
          <section><h2 class="section-heading">Quick access</h2><div class="grid three">
            ${quickCard("Review Artist Applications", "applications")}
            ${quickCard("Review Releases", "releases")}
            ${quickCard("Manage Catalog", "catalog")}
            ${quickCard("Manage Users", "users")}
            ${quickCard("Support Tickets", "support")}
            ${quickCard("Platform Settings", "settings")}
            ${quickCard("Platform Health", "health")}
          </div></section>
          ${state.health?.warnings?.length ? `
            <section class="panel">
              <h2>Storage Warning</h2>
              <p class="details">${state.health.warnings.map(escapeHtml).join("<br />")}</p>
            </section>` : ""}
        `;
      }

      function quickCard(label, view) {
        if (!canView(view)) return "";
        return `
          <button class="shortcut" data-view="${view}" type="button"><span>${label}</span><span aria-hidden="true">&rarr;</span></button>`;
      }

      function adminRoleLabel(role) {
        return {super_admin:"Super Admin", content_admin:"Content Admin", moderator:"Moderator", support_admin:"Support Admin"}[role] || "Unknown role";
      }

      function renderApplications() {
        if (state.activeApplicationId !== null) return renderApplicationDetail();
        viewEl.innerHTML = `
          <section class="applications-workspace">
            <div class="toolbar">
              <h2>Applications</h2>
              <div class="actions"><button class="secondary" data-action="refresh-applications" type="button">Refresh</button>
              <button class="ghost" data-action="application-logout" type="button">Logout</button></div>
            </div>
            <div class="application-filters">
              <label>Search applications<input id="applicationSearch" type="search" data-filter="applicationSearch" value="${escapeHtml(state.filters.applicationSearch)}" placeholder="Artist, applicant or account" /></label>
              <label>Status<select data-filter="applicationStatus">${["", ...applicationStatuses].map((status) => `<option value="${status}" ${state.filters.applicationStatus === status ? "selected" : ""}>${escapeHtml(applicationStatusLabel(status))}</option>`).join("")}</select></label>
              <button class="ghost" id="clearApplicationFilters" data-action="clear-application-filters" type="button" ${state.filters.applicationStatus || state.filters.applicationSearch ? "" : "hidden"}>Clear filters</button>
            </div>
            <p class="meta" id="applicationCount" aria-live="polite">${applicationRows().length} of ${state.applications.length} applications</p>
            <div class="list" id="applicationResults" style="margin-top: 12px;">${applicationResultsHtml()}</div>
          </section>`;
      }

      function applicationStatusLabel(status) {
        return ({pending:"Pending / Under Review", approved:"Approved", rejected:"Rejected", changes_requested:"Changes requested"})[status] || "All statuses";
      }

      function applicationRows() {
        const search = state.filters.applicationSearch.trim().toLowerCase();
        return state.applications.filter((row) => (!state.filters.applicationStatus || row.status === state.filters.applicationStatus) &&
          (!search || [row.artist_name, row.contact_name, row.applicant?.name, row.applicant?.email, row.email, row.listener]
            .some((value) => String(value ?? "").toLowerCase().includes(search))))
          .sort((a, b) => {
            const rank = (row) => ["pending", "changes_requested"].includes(row.status) ? 0 : 1;
            return rank(a) - rank(b) || String(b.created_at || "").localeCompare(String(a.created_at || "")) || Number(b.id) - Number(a.id);
          });
      }

      function applicationResultsHtml() {
        const rows = applicationRows();
        return rows.length ? pagedList("applications", rows, applicationItem) : `<p class="empty" role="status">${state.applications.length ? "No applications match your search or status filter." : "No artist applications have been submitted yet."}</p>`;
      }

      function updateApplicationResults() {
        const results = document.getElementById("applicationResults");
        if (!results) return;
        results.innerHTML = applicationResultsHtml();
        document.getElementById("applicationCount").textContent = `${applicationRows().length} of ${state.applications.length} applications`;
        document.getElementById("clearApplicationFilters").hidden = !state.filters.applicationStatus && !state.filters.applicationSearch;
      }

      function applicationItem(application) {
        return `
          <article class="item">
            ${application.photo ? `<img class="thumb" src="${escapeHtml(application.photo)}" alt="" loading="lazy" />` : '<div class="thumb" aria-hidden="true"></div>'}
            <div>
              <div class="item-title">${escapeHtml(application.artist_name || "Unnamed artist")}</div>
              <p class="meta">Applicant: ${escapeHtml(application.applicant?.name || application.contact_name || "Account unavailable")} | ${escapeHtml(application.genre)}</p>
              <div class="details">${badge(application.status)} <span class="meta">Submitted ${formatDate(application.created_at)}</span></div>
            </div>
            <div class="actions"><button class="secondary" data-action="review-application" data-id="${application.id}" type="button">Review</button></div>
          </article>`;
      }

      let applicationDetailRequest = 0;
      const pendingApplicationReviews = new Set();

      async function openApplication(id) {
        const request = ++applicationDetailRequest, token = state.token;
        state.activeApplicationId = String(id);
        state.applicationDetailState = "loading";
        renderPreservingScroll();
        try {
          const data = await api(`/admin-api/artist-applications/${encodeURIComponent(id)}`, { cache:"no-store", signal:AbortSignal.timeout(45000) });
          if (token !== state.token || request !== applicationDetailRequest) return;
          if (!data || String(data.id) !== String(id) || !Array.isArray(data.history)) throw new Error("Unexpected application response. Please retry.");
          state.applicationDetail = data; state.applicationDetailState = "ready";
        } catch (error) {
          if (token !== state.token || request !== applicationDetailRequest) return;
          state.applicationDetailState = error.status === 403 ? "forbidden" : "error";
          state.applicationDetailError = error.message;
        }
        if (state.activeView === "applications" && state.activeApplicationId === String(id)) renderPreservingScroll();
      }

      function renderApplicationDetail() {
        const header = `<div class="actions"><button class="ghost" data-action="back-applications" type="button">Back to applications</button><button class="secondary" data-action="review-application" data-id="${state.activeApplicationId}" ${state.applicationDetailState === "loading" || pendingApplicationReviews.has(String(state.activeApplicationId)) ? "disabled" : ""} type="button">Refresh</button></div>`;
        if (state.applicationDetailState !== "ready") {
          const loading = state.applicationDetailState === "loading";
          viewEl.innerHTML = `<section class="applications-workspace">${header}<div role="${loading ? "status" : "alert"}" class="details"><h2>${loading ? "Loading application..." : state.applicationDetailState === "forbidden" ? "Permission denied" : "Could not load application"}</h2>${loading ? "" : `<p>${escapeHtml(state.applicationDetailError)}</p><button data-action="review-application" data-id="${state.activeApplicationId}" type="button">Retry</button>`}</div></section>`;
          return;
        }
        const row = state.applicationDetail;
        const field = (label, value) => `<div><dt>${label}</dt><dd>${escapeHtml(value || "Not provided")}</dd></div>`;
        const canAct = ["pending", "changes_requested"].includes(row.status);
        const busy = pendingApplicationReviews.has(String(row.id));
        viewEl.innerHTML = `<section class="applications-workspace">${header}
          <div class="review-identity">
          ${row.photo ? `<img class="thumb" src="${escapeHtml(row.photo)}" alt="Submitted artist photo" />` : ""}
          <div><h2>${escapeHtml(row.artist_name)}</h2><p class="details">${badge(row.status)}</p></div></div>
          <h3>Application details</h3>
          <dl class="application-fields">
          ${field("Applicant", row.applicant?.name || row.contact_name)}${field("Account", row.applicant ? `${row.applicant.email || "Account"} (#${row.listener})` : "Account unavailable")}
          ${field("Contact name", row.contact_name)}${field("Contact email", row.email)}${field("Phone", row.phone)}${field("Location", [row.region, row.country].filter(Boolean).join(", "))}
          ${field("Genre", row.genre)}${field("Genre note", row.genre_note)}${field("Biography", row.bio)}${field("Social link", row.social_link)}
          ${field("Information confirmed genuine", row.genuine_confirmed ? "Yes" : "No")}${field("Linked artist", row.artist ? `${row.artist.name} (#${row.artist.id})` : "Not linked")}
          ${field("Submitted", row.created_at)}${field("Last updated", row.updated_at || row.created_at)}${field("Last reviewed", row.reviewed_at)}${field("Reviewed by", row.reviewed_by)}${field("Review reason", row.review_reason || row.rejection_reason)}

          ${canAct ? `<section class="review-decision"><h3>Review decision</h3><label>Review reason (required for rejection or changes)<textarea id="applicationReviewReason" ${busy ? "disabled" : ""}></textarea></label><div class="actions" style="margin-top:12px;">
          <button data-action="approve-application" data-id="${row.id}" ${busy ? "disabled" : ""} type="button">Approve</button>
          <button class="secondary" data-action="changes-application" data-id="${row.id}" ${busy ? "disabled" : ""} type="button">Request changes</button>
          <button class="danger" data-action="reject-application" data-id="${row.id}" ${busy ? "disabled" : ""} type="button">Reject</button></div></section>` : ""}</section>`;

      async function reviewApplication(action, id) {
        const key = String(id);
        if (pendingApplicationReviews.has(key)) return;
        const reason = (document.getElementById("applicationReviewReason")?.value || "").trim();
        if (action !== "approve-application" && !reason) throw new Error("Enter a clear review reason.");
        if (action === "approve-application" && !confirm("Approve this artist application?")) return;
        pendingApplicationReviews.add(key);
        document.querySelectorAll('[data-action$="-application"]').forEach((button) => { if (String(button.dataset.id) === key) button.disabled = true; });
        const token = state.token;
        try {
          const endpoint = {"approve-application":"approve", "reject-application":"reject", "changes-application":"request-changes"}[action];
          await api(`/admin-api/artist-applications/${encodeURIComponent(key)}/${endpoint}`, {method:"POST", signal:AbortSignal.timeout(45000), body:JSON.stringify({reason, review_reason:reason})});
          if (token !== state.token) return;
          state.loads.dashboard = {status:"idle"};
          await loadResource("applications", {force:true});
          if (state.activeView === "applications" && state.activeApplicationId === key) await openApplication(key);
        } catch (error) {
          if (error.status === 409 && token === state.token && state.activeView === "applications" && state.activeApplicationId === key) await openApplication(key);
          throw error;
        } finally {
          pendingApplicationReviews.delete(key);
          document.querySelectorAll('[data-action$="-application"]').forEach((button) => { if (String(button.dataset.id) === key) button.disabled = false; });
        }
      }

          <label>Publication<select data-filter="releasePublication">${[["","All releases"],["approved_scheduled","Approved + Scheduled"],["due","Already due (UTC)"],["future","Future scheduled dates"],["eligible","Eligible if enabled"]].map(([value,label]) => `<option value="${value}" ${state.filters.releasePublication === value ? "selected" : ""}>${label}</option>`).join("")}</select></label>

      function updateReleaseResults() {
        const results = document.getElementById("releaseResults");
        if (!results) return;
        const search = state.filters.releaseSearch.trim().toLowerCase();
        const publication = state.filters.releasePublication;
        const rows = state.releases.filter((row) => (!state.filters.releaseStatus || row.status === state.filters.releaseStatus) &&
          (!publication || (row.publication?.candidate && (publication === "approved_scheduled" || (publication === "eligible" ? row.publication.eligible : row.publication.timing === publication)))) &&
          (!search || [row.title, row.artist_name].some((value) => String(value || "").toLowerCase().includes(search))))
          .sort((a,b) => Number(b.status === "under_review") - Number(a.status === "under_review") || String(b.submitted_at || b.created_at || "").localeCompare(String(a.submitted_at || a.created_at || "")));
        results.innerHTML = rows.length ? pagedList("releases", rows, releaseItem) : `<p class="empty" role="status">${state.releases.length ? "No releases match your search or status filter." : "No releases have been submitted yet."}</p>`;
        document.getElementById("releaseCount").textContent = `${rows.length} of ${state.releases.length} releases`;
      }

      function publicationSummary(row) {
        if (!row.publication?.candidate) return "";
        return `<p class="details">Publication: ${row.publication.eligible ? "Eligible when publisher is enabled" : "Not currently eligible"}<br />${escapeHtml(row.publication.reason || "Due date reached; metadata and ownership checks passed.")}</p>`;
      }

      let releaseDetailRequest = 0;
      const pendingReleaseReviews = new Set();
      async function openRelease(id) {
        const request = ++releaseDetailRequest, token = state.token;
        state.activeReleaseId = String(id); state.releaseDetailState = "loading";
        renderPreservingScroll();
        try {
          const data = await api(`/admin-api/releases/${encodeURIComponent(id)}`, {cache:"no-store", signal:AbortSignal.timeout(45000)});
          if (token !== state.token || request !== releaseDetailRequest) return;
          if (!data || String(data.id) !== String(id) || !Array.isArray(data.history)) throw new Error("Unexpected release response. Please retry.");
          state.releaseDetail = data; state.releaseDetailState = "ready";
        } catch (error) {
          if (token !== state.token || request !== releaseDetailRequest) return;
          state.releaseDetailState = error.status === 403 ? "forbidden" : "error"; state.releaseDetailError = error.message;
        }
        if (state.activeView === "releases" && state.activeReleaseId === String(id)) renderPreservingScroll();
      }

      function renderReleaseDetail() {
        const busy = pendingReleaseReviews.has(String(state.activeReleaseId));
        const header = `<div class="actions"><button class="ghost" data-action="back-releases" type="button">Back to releases</button><button class="secondary" data-action="review-release" data-id="${state.activeReleaseId}" ${busy || state.releaseDetailState === "loading" ? "disabled" : ""} type="button">Refresh</button></div>`;
        if (state.releaseDetailState !== "ready") {
          const loading = state.releaseDetailState === "loading";
          viewEl.innerHTML = `<section class="applications-workspace">${header}<div role="${loading ? "status" : "alert"}"><h2>${loading ? "Loading release..." : state.releaseDetailState === "forbidden" ? "Permission denied" : "Could not load release"}</h2>${loading ? "" : `<p>${escapeHtml(state.releaseDetailError)}</p><button data-action="review-release" data-id="${state.activeReleaseId}" type="button">Retry</button>`}</div></section>`;
          return;
        }
        const row = state.releaseDetail;
        const field = (label,value) => `<div><dt>${label}</dt><dd>${escapeHtml(value || "Not provided")}</dd></div>`;
        viewEl.innerHTML = `<section class="applications-workspace">${header}<div class="review-identity">
          ${row.cover_image ? `<img class="release-artwork" src="${escapeHtml(row.cover_image)}" alt="Submitted artwork" />` : ""}
          <div><h2>${escapeHtml(row.title)}</h2><p class="details">${escapeHtml(row.artist_name)} ${badge(row.status)}</p></div></div>
          <h3>Audio preview</h3>
          ${row.audio_file ? `<div><audio id="releaseAudio" controls preload="metadata" src="${escapeHtml(row.audio_file)}"></audio><p id="releaseAudioStatus" class="meta" role="status">Ready to preview</p><button class="secondary" data-action="retry-release-audio" type="button" hidden>Retry audio</button></div>` : '<p class="details">No audio uploaded.</p>'}
          <dl class="application-fields">${field("Type",row.release_type)}${field("Featured artist",row.featured_artist)}${field("Genre",row.genre)}${field("Genre note",row.genre_note)}${field("Language",row.language)}${field("Explicit",row.explicit ? "Yes" : "No")}${field("Release date (UTC)",row.release_date)}${field("Submitted",row.submitted_at)}${field("Producer",row.producer)}${field("Songwriter",row.songwriter)}${field("Description",row.description)}${field("Rights confirmed",row.rights_confirmed ? "Yes" : "No")}${field("Artist linkage",`${row.artist_name} (#${row.artist})`)}${field("Submitting account",row.listener ? `${row.listener.name} (#${row.listener.id})` : "Account unavailable")}${field("Active ownership linkage",row.linkage_valid ? "Verified" : "Needs attention")}${field("Approved",row.approved_at)}${field("Published",row.published_at)}${field("Last updated",row.updated_at)}${field("Review reason",row.review_reason || row.rejection_reason)}</dl>
          ${publicationSummary(row)}<h3>Review history</h3><div class="application-history details">${pagedList(`release-history-${row.id}`, row.history, (entry) => `<div class="history-entry">${escapeHtml(entry.action.replaceAll("_", " "))}: ${escapeHtml(entry.at)}<br />${escapeHtml(entry.admin_user)}${entry.reason ? `<br />${escapeHtml(entry.reason)}` : ""}</div>`, '<p>No review decisions yet.</p>')}</div>
          ${["under_review","scheduled"].includes(row.status) ? `<section class="review-decision"><h3>Review decision</h3><label>Review reason (required for rejection or changes)<textarea id="releaseReviewReason" ${busy ? "disabled" : ""}></textarea></label><div class="actions" style="margin-top:12px;">
          ${row.status === "under_review" ? `<button data-action="approve-release" data-id="${row.id}" ${busy || !row.linkage_valid ? "disabled" : ""} type="button">Approve</button>` : ""}
          <button class="secondary" data-action="changes-release" data-id="${row.id}" ${busy ? "disabled" : ""} type="button">Request changes</button><button class="danger" data-action="reject-release" data-id="${row.id}" ${busy ? "disabled" : ""} type="button">Reject</button></div><p id="releaseSaving" role="status">${busy ? "Saving review..." : ""}</p></section>` : ""}</section>`;
        const audio = document.getElementById("releaseAudio");
        if (audio) for (const [event, message] of Object.entries({loadstart:"Loading audio...",waiting:"Buffering...",stalled:"Buffering...",canplay:"Ready to preview",playing:"Playing",pause:"Paused",ended:"Preview ended",error:"Audio could not load. Retry or refresh your Admin session."})) {
          audio.addEventListener(event, () => {
            if (!audio.isConnected) return;
            const failed = event === "error" || Boolean(audio.error);
            document.getElementById("releaseAudioStatus").textContent = failed ? "Audio could not load. Retry or refresh your Admin session." : message;
            document.querySelector('[data-action="retry-release-audio"]').hidden = !failed;
          });
        }
      }

      async function reviewRelease(action,id) {
        const key = String(id), row = state.releaseDetail;
        if (pendingReleaseReviews.has(key) || state.releaseDetailState !== "ready" || String(row?.id) !== key) return;
        const reason = (document.getElementById("releaseReviewReason")?.value || "").trim();
        if (action !== "approve-release" && reason.length < 5) throw new Error("Enter a meaningful review reason (at least 5 characters).");
        if (action === "approve-release" && !confirm("Approve this release after reviewing the audio and metadata?")) return;
        pendingReleaseReviews.add(key);
        document.querySelectorAll('[data-action$="-release"]').forEach((button) => {if (String(button.dataset.id) === key) button.disabled = true;});
        const saving = document.getElementById("releaseSaving"); if (saving) saving.textContent = "Saving review...";
        const token = state.token;
        try {
          const endpoint = {"approve-release":"approve","reject-release":"reject","changes-release":"request-changes"}[action];
          await api(`/admin-api/releases/${encodeURIComponent(key)}/${endpoint}`, {method:"POST",signal:AbortSignal.timeout(45000),body:JSON.stringify({reason,review_reason:reason,expected_updated_at:row.updated_at})});
          if (token !== state.token) return;
          state.loads.dashboard = {status:"idle"}; state.loads.songs = {status:"idle"};
          await loadResource("releases",{force:true});
          if (state.activeView === "releases" && state.activeReleaseId === key) await openRelease(key);
        } catch (error) {
          if (error.status === 409 && token === state.token && state.activeView === "releases" && state.activeReleaseId === key) await openRelease(key);
          throw error;
        } finally {
          pendingReleaseReviews.delete(key);
          if (token === state.token && state.activeView === "releases" && state.activeReleaseId === key) {
            document.querySelectorAll('[data-action$="-release"]').forEach((button) => {if (String(button.dataset.id) === key) button.disabled = button.dataset.action === "approve-release" && !state.releaseDetail?.linkage_valid;});
            const saving = document.getElementById("releaseSaving"); if (saving) saving.textContent = "";
          }
        }
      }

      async function saveAdminForm(event) {
        event.preventDefault();
        const form = event.target, kind = form.dataset.adminForm, id = form.dataset.id;
        if (form.dataset.pending) return;
        if (["access","reset","revoke"].includes(kind) && !confirm("Confirm this security change? Existing sessions for this Admin will be revoked.")) return;
        form.dataset.pending = "1";
        const button = form.querySelector('button[type="submit"]'); button.disabled = true;
        try {
          const body = Object.fromEntries(new FormData(form));
          if (kind === "access") body.active = body.active === "true";
          const payload = JSON.stringify(body);
          form.querySelectorAll('input[type="password"]').forEach(input=>{input.value="";});
          const route = {bootstrap:"/admin-api/admin-accounts/bootstrap",create:"/admin-api/admin-accounts",access:`/admin-api/admin-accounts/${id}`,reset:`/admin-api/admin-accounts/${id}/reset-password`,revoke:`/admin-api/admin-accounts/${id}/revoke-sessions`,password:"/admin-api/change-password"}[kind];
          await api(route,{method:kind==="access"?"PATCH":"POST",body:payload});
          setStatus("Saved. Existing sessions were revoked where applicable.");
          if (kind === "password") {state.token="";state.admin=null;state.loads={};showLogin();}
          else await loadData();
        } finally { delete form.dataset.pending; button.disabled=false; }
      }
