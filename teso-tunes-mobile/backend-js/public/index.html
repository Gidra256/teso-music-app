<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TesoHub Music Admin Console</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #050506;
        --surface: #0b0b10;
        --card: #111116;
        --elevated: #1b1b23;
        --border: #2b2638;
        --primary: #20e6f3;
        --accent: #f427c8;
        --success: #36f2a5;
        --danger: #ff4d6d;
        --warning: #ffca4a;
        --text: #ffffff;
        --soft: #d8d8e2;
        --muted: #8b8798;
      }

      * {
        box-sizing: border-box;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        align-items: center;
        background: var(--primary);
        border: 1px solid transparent;
        border-radius: 8px;
        color: #031013;
        cursor: pointer;
        display: inline-flex;
        font-size: 13px;
        font-weight: 900;
        justify-content: center;
        min-height: 40px;
        padding: 0 13px;
      }

      button.secondary {
        background: var(--elevated);
        border-color: var(--border);
        color: var(--soft);
      }

      button.ghost {
        background: transparent;
        border-color: var(--border);
        color: var(--soft);
      }

      button.danger {
        background: var(--danger);
        color: #180107;
      }

      button.active {
        background: var(--primary);
        color: #031013;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.58;
      }

      input,
      select,
      textarea {
        background: #09090d;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        min-height: 40px;
        padding: 10px;
        width: 100%;
      }

      input[type="checkbox"] {
        min-height: auto;
        width: auto;
      }

      label {
        color: var(--soft);
        display: grid;
        font-size: 12px;
        font-weight: 900;
        gap: 6px;
      }

      textarea {
        min-height: 96px;
        resize: vertical;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font-size: clamp(26px, 4vw, 38px);
        font-weight: 950;
        line-height: 1;
      }

      h2 {
        font-size: 19px;
      }

      h3 {
        font-size: 15px;
      }

      .login {
        margin: 12vh auto 0;
        max-width: 430px;
        padding: 20px;
      }

      .login .panel {
        padding: 22px;
      }

      .shell {
        display: grid;
        gap: 20px;
        grid-template-columns: 260px minmax(0, 1fr);
        min-height: 100vh;
        padding: 18px;
      }

      .sidebar {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 14px;
        position: sticky;
        top: 18px;
        height: calc(100vh - 36px);
      }

      .brand {
        align-items: center;
        display: flex;
        gap: 10px;
      }

      .logo {
        background: #000;
        border-radius: 8px;
        height: 44px;
        object-fit: cover;
        width: 44px;
      }

      .brand-title {
        font-size: 16px;
        font-weight: 950;
      }

      .muted,
      .subtitle {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .nav {
        display: grid;
        gap: 6px;
        overflow: auto;
      }

      .nav-title {
        color: var(--muted);
        font-size: 11px;
        font-weight: 900;
        margin: 12px 0 3px;
        text-transform: uppercase;
      }

      .nav button {
        justify-content: flex-start;
        min-height: 38px;
        width: 100%;
      }

      .content {
        display: grid;
        gap: 18px;
        min-width: 0;
      }

      .content.content-bounded {
        grid-template-rows: auto minmax(0, 1fr);
        height: calc(100vh - 36px);
        overflow: hidden;
      }

      .topbar {
        align-items: flex-start;
        display: flex;
        gap: 12px;
        justify-content: space-between;
      }

      .panel {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
      }

      .grid {
        display: grid;
        gap: 14px;
      }

      .grid.two {
        grid-template-columns: minmax(280px, 0.85fr) minmax(0, 1.45fr);
      }

      .grid.three {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .stats {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(4, minmax(140px, 1fr));
      }

      .stat {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 14px;
      }

      .stat-value {
        font-size: 28px;
        font-weight: 950;
        margin-top: 8px;
      }

      .form {
        display: grid;
        gap: 12px;
      }

      .form-row {
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .toolbar,
      .actions {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .toolbar {
        justify-content: space-between;
      }

      .list {
        display: grid;
        gap: 10px;
      }

      .content.content-bounded #view,
      .split-dashboard,
      .split-panel {
        min-height: 0;
      }

      .split-dashboard {
        height: 100%;
      }

      .split-panel {
        display: flex;
        flex-direction: column;
        max-height: 100%;
        overflow: hidden;
      }

      .split-form-panel {
        overflow: auto;
        overscroll-behavior: contain;
      }

      .split-list-header {
        background: var(--card);
        flex: 0 0 auto;
        padding-bottom: 12px;
      }

      .split-list-header + .scroll-region {
        border-top: 1px solid var(--border);
        padding-top: 12px;
      }

      .scroll-region {
        min-height: 0;
        overflow: auto;
        overscroll-behavior: contain;
        padding-right: 4px;
      }

      .item {
        align-items: start;
        background: #09090d;
        border: 1px solid var(--border);
        border-radius: 8px;
        display: grid;
        gap: 12px;
        grid-template-columns: 72px minmax(0, 1fr) auto;
        padding: 10px;
      }

      .thumb {
        background: var(--elevated);
        border-radius: 8px;
        height: 72px;
        object-fit: cover;
        width: 72px;
      }

      .item-title {
        font-weight: 950;
      }

      .meta {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
        margin-top: 4px;
      }

      .details {
        color: var(--soft);
        font-size: 13px;
        line-height: 1.55;
        margin-top: 8px;
      }

      .badge {
        background: rgba(32, 230, 243, 0.12);
        border: 1px solid rgba(32, 230, 243, 0.32);
        border-radius: 999px;
        color: var(--primary);
        display: inline-flex;
        font-size: 11px;
        font-weight: 950;
        padding: 4px 8px;
        text-transform: uppercase;
      }

      .badge.warn {
        background: rgba(255, 202, 74, 0.1);
        border-color: rgba(255, 202, 74, 0.32);
        color: var(--warning);
      }

      .badge.danger {
        background: rgba(255, 77, 109, 0.1);
        border-color: rgba(255, 77, 109, 0.32);
        color: var(--danger);
      }

      .badge.ok {
        background: rgba(54, 242, 165, 0.1);
        border-color: rgba(54, 242, 165, 0.32);
        color: var(--success);
      }

      .status-line {
        color: var(--accent);
        font-size: 13px;
        font-weight: 900;
        min-height: 18px;
      }

      .empty {
        color: var(--muted);
        padding: 10px 0;
      }

      audio {
        margin-top: 10px;
        max-width: 100%;
        width: 420px;
      }

      .hidden {
        display: none;
      }

      @media (max-width: 980px) {
        .content.content-bounded {
          display: grid;
          height: auto;
          overflow: visible;
        }

        .content.content-bounded #view,
        .split-dashboard {
          height: auto;
          overflow: visible;
        }

        .split-panel {
          max-height: none;
          overflow: visible;
        }

        .split-form-panel,
        .scroll-region {
          overflow: visible;
          padding-right: 0;
        }

        .shell {
          grid-template-columns: 1fr;
        }

        .sidebar {
          height: auto;
          position: static;
        }

        .nav {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .stats,
        .grid.three,
        .grid.two {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 680px) {
        .shell {
          padding: 12px;
        }

        .topbar,
        .toolbar {
          align-items: stretch;
          flex-direction: column;
        }

        .item {
          grid-template-columns: 56px minmax(0, 1fr);
        }

        .thumb {
          height: 56px;
          width: 56px;
        }

        .item .actions {
          grid-column: 1 / -1;
        }

        .form-row,
        .nav {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main id="loginPanel" class="login">
      <section class="panel">
        <form id="loginForm" class="form">
          <div class="brand">
            <img class="logo" src="/app-assets/images/tesohub-music.png" alt="" />
            <div>
              <h1>TesoHub Admin</h1>
              <p class="subtitle">Secure platform control centre</p>
            </div>
          </div>
          <label>Username<input id="loginUsername" value="admin" autocomplete="username" /></label>
          <label>Password<input id="loginPassword" type="password" autocomplete="current-password" /></label>
          <button type="submit">Sign in</button>
          <p id="loginStatus" class="status-line"></p>
        </form>
      </section>
    </main>

    <main id="adminPanel" class="shell hidden">
      <aside class="sidebar">
        <div class="brand">
          <img class="logo" src="/app-assets/images/tesohub-music.png" alt="" />
          <div>
            <div class="brand-title">TesoHub Music</div>
            <p id="adminRole" class="muted">Admin Console V1</p>
          </div>
        </div>
        <nav class="nav" id="nav"></nav>
        <button id="refreshButton" class="secondary" type="button">Refresh data</button>
        <button id="logoutButton" class="ghost" type="button">Logout</button>
      </aside>

      <section class="content">
        <div class="topbar">
          <div>
            <h1 id="viewTitle">Dashboard</h1>
            <p id="viewSubtitle" class="subtitle">Real backend data only</p>
          </div>
          <p id="status" class="status-line"></p>
        </div>
        <section id="view"></section>
      </section>
    </main>

    <script>
      const categories = ["Rappers", "Other Secular Artists", "Gospel Artists"];
      const applicationStatuses = ["pending", "approved", "rejected", "changes_requested"];
      const releaseStatuses = ["under_review", "approved", "scheduled", "published", "rejected", "draft"];
      const songStatuses = ["published", "hidden", "removed", "under_review"];
      const userStatuses = ["active", "suspended"];
      const reportStatuses = ["open", "reviewing", "resolved", "dismissed"];
      const supportStatuses = ["open", "in_progress", "waiting_on_user", "resolved", "closed"];
      const supportPriorities = ["low", "normal", "high", "urgent"];
      const supportCategories = [
        "Account / Login",
        "Playback",
        "Playlist / Library",
        "App Bug",
        "Downloads",
        "Report Content",
        "Artist Application",
        "Upload Problem",
        "Release Review",
        "Metadata Correction",
        "Artist Profile",
        "Copyright / Ownership",
        "Analytics",
        "Other",
      ];
      const views = [
        ["dashboard", "Dashboard", "Control centre overview"],
        ["applications", "Artist Applications", "Review applicant artists"],
        ["releases", "Release Review", "Listen and approve uploaded songs"],
        ["catalog", "Music Catalog", "Manage published and hidden songs"],
        ["artists", "Artists", "Manage artist profiles and status"],
        ["users", "Users", "Support and account status"],
        ["support", "Support", "Tickets, replies, notes, and assignment"],
        ["reports", "Reports", "Moderation queue"],
        ["discovery", "Home & Discovery", "Curated featured content"],
        ["genres", "Genres", "Master genre list"],
        ["settings", "Platform Settings", "Operational switches and upload policy"],
        ["health", "Platform Health", "Backend and storage visibility"],
        ["audit", "Audit Log", "Admin activity history"],
      ];

      const state = {
        activeView: "dashboard",
        admin: null,
        token: localStorage.getItem("tesoAdminToken") || "",
        dashboard: null,
        artists: [],
        songs: [],
        applications: [],
        releases: [],
        users: [],
        supportTickets: [],
        activeSupportTicket: null,
        reports: [],
        genres: [],
        settings: null,
        flags: {},
        health: null,
        audit: [],
        loads: {},
        editingArtistId: null,
        editingSongId: null,
        editingGenreId: null,
        filters: {
          applicationStatus: "",
          releaseStatus: "",
          catalogSearch: "",
          catalogStatus: "",
          userSearch: "",
          userRole: "",
          userStatus: "",
          supportCategory: "",
          supportSearch: "",
          supportStatus: "",
          reportStatus: "",
        },
      };

      const loginPanel = document.getElementById("loginPanel");
      const adminPanel = document.getElementById("adminPanel");
      const loginStatusEl = document.getElementById("loginStatus");
      const statusEl = document.getElementById("status");
      const contentEl = document.querySelector(".content");
      const viewEl = document.getElementById("view");
      const viewTitleEl = document.getElementById("viewTitle");
      const viewSubtitleEl = document.getElementById("viewSubtitle");
      const navEl = document.getElementById("nav");
      const adminRoleEl = document.getElementById("adminRole");
      const boundedViews = new Set(["artists", "catalog", "discovery", "genres"]);
      const scrollMemory = {};
      const viewPermissions = {
        dashboard: ["artists", "catalog", "releases", "reports"],
        applications: ["applications"], releases: ["releases"], catalog: ["catalog"],
        artists: ["artists"], users: ["users"], support: ["support:view"],
        reports: ["reports"], discovery: ["discovery"], genres: ["genres"],
        settings: ["settings"], health: ["*"], audit: ["*"],
      };

      function can(permission) {
        const permissions = state.admin?.permissions || [];
        return permissions.includes("*") || permissions.includes(permission);
      }

      function canView(view) {
        return (viewPermissions[view] || []).some(can);
      }

      function sourcesForView(view) {
        return (viewSources[view] || []).filter((key) => key !== "health" || can("*"));
      }

      function setStatus(message) {
        statusEl.textContent = message || "";
      }

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function formatDate(value) {
        if (!value) return "No date";
        return String(value).slice(0, 10);
      }

      function number(value) {
        return Number(value || 0).toLocaleString();
      }

      function badge(value) {
        const status = String(value || "unknown");
        const tone = ["approved", "published", "active", "resolved"].includes(status)
          ? "ok"
          : ["rejected", "removed", "suspended", "dismissed"].includes(status)
            ? "danger"
            : ["pending", "under_review", "scheduled", "reviewing", "hidden"].includes(status)
              ? "warn"
              : "";
        return `<span class="badge ${tone}">${escapeHtml(status.replaceAll("_", " "))}</span>`;
      }

      function showLogin() {
        adminPanel.classList.add("hidden");
        loginPanel.classList.remove("hidden");
      }

      function showAdmin() {
        loginPanel.classList.add("hidden");
        adminPanel.classList.remove("hidden");
      }

      async function api(path, options = {}) {
        const { suppressForbiddenLogout, ...fetchOptions } = options;
        const headers = {
          ...(options.body instanceof FormData ? {} : { "Content-Type": "application/json" }),
          ...(state.token ? { Authorization: `Bearer ${state.token}` } : {}),
          ...(options.headers || {}),
        };
        const response = await fetch(path, { ...fetchOptions, headers });
        const text = await response.text();
        let data;
        try {
          data = text ? JSON.parse(text) : null;
        } catch (error) {
          const responseError = new Error(`Could not read the server response (${response.status}). Please retry.`);
          responseError.status = response.status;
          throw responseError;
        }

        if (!response.ok) {
          const message = response.status === 403 ? "You do not have permission to perform this action." :
            data?.detail || `Request failed (${response.status})`;
          if ([401, 403].includes(response.status) && path === "/admin-api/me" && !suppressForbiddenLogout) {
            localStorage.removeItem("tesoAdminToken");
            state.token = "";
            showLogin();
          }
          const error = new Error(message);
          error.status = response.status;
          throw error;
        }
        return data;
      }

      const dataSources = {
        admin: "/admin-api/me",
        dashboard: "/admin-api/dashboard",
        artists: "/admin-api/artists",
        songs: "/admin-api/songs",
        applications: "/admin-api/artist-applications",
        releases: "/admin-api/releases",
        users: "/admin-api/users",
        supportTickets: "/admin-api/support/tickets",
        reports: "/admin-api/reports",
        genres: "/admin-api/genres",
        settings: "/admin-api/platform-settings",
        flags: "/admin-api/feature-flags",
        health: "/admin-api/platform-health",
        audit: "/admin-api/audit-log",
      };
      const viewSources = {
        dashboard: ["dashboard", "health"],
        applications: ["applications"],
        releases: ["releases"],
        catalog: ["songs", "artists", "genres"],
        artists: ["artists"],
        users: ["users"],
        support: ["supportTickets"],
        reports: ["reports"],
        discovery: ["artists", "songs"],
        genres: ["genres"],
        settings: ["settings", "flags"],
        health: ["health"],
        audit: ["audit"],
      };
      const arraySources = new Set([
        "artists", "songs", "applications", "releases", "users",
        "supportTickets", "reports", "genres", "audit",
      ]);
      const pendingLoads = new Map();
      let readQueue = Promise.resolve();

      function loadResource(key, { force = false } = {}) {
        const requestedToken = state.token;
        const pendingKey = `${requestedToken}:${key}`;
        if (pendingLoads.has(pendingKey)) return pendingLoads.get(pendingKey);
        if (!force && state.loads[key]?.status === "ready") return Promise.resolve();
        state.loads[key] = { status: "loading" };
        // Serialize reads across views, including rapid navigation and retries.
        const job = readQueue.then(async () => {
          if (!requestedToken || requestedToken !== state.token) {
            pendingLoads.delete(pendingKey);
            return;
          }
          try {
            const data = await api(dataSources[key], {
              suppressForbiddenLogout: true,
              signal: AbortSignal.timeout(45000),
            });
            if (requestedToken !== state.token) return;
            if (arraySources.has(key) ? !Array.isArray(data) : !data || typeof data !== "object" || Array.isArray(data)) {
              throw new Error("The server returned unexpected data. Please retry.");
            }
            if (key === "admin" && !data.admin) {
              throw new Error("Could not verify your admin session. Please retry.");
            }
            state[key] = key === "admin" ? data.admin : data;
            state.loads[key] = { status: "ready" };
            if (key === "admin") {
              adminRoleEl.textContent = `${state.admin.username} - ${state.admin.role.replaceAll("_", " ")}`;
              if (!canView(state.activeView)) {
                state.activeView = views.find(([view]) => canView(view))?.[0] || "dashboard";
              }
            }
          } catch (error) {
            if (requestedToken !== state.token) return;
            if (key === "admin" && [401, 403].includes(error.status)) {
              localStorage.removeItem("tesoAdminToken");
              state.token = "";
              loginStatusEl.textContent = "Your session has expired. Please sign in again.";
              showLogin();
              return;
            }
            state.loads[key] = {
              status: "error",
              message: error.status === 403 ? "Your account does not have access to this section." : error.message,
            };
          } finally {
            pendingLoads.delete(pendingKey);
            if (requestedToken === state.token && (key === "admin" || viewSources[state.activeView].includes(key))) {
              renderPreservingScroll();
            }
          }
        });
        pendingLoads.set(pendingKey, job);
        readQueue = job.catch(() => {});
        return job;
      }

      async function loadView(view, { force = false } = {}) {
        if (!state.token) return;
        if (state.loads.admin?.status !== "ready") await loadResource("admin");
        if (!state.token || state.loads.admin?.status !== "ready") return;
        if (!canView(view)) return setStatus("You do not have permission to open this section.");
        const keys = ["admin", ...sourcesForView(view)];
        const jobs = keys.map((key) => loadResource(key, { force: force && key !== "admin" }));
        renderPreservingScroll();
        await Promise.all(jobs);
      }

      async function loadData() {
        if (!state.token) return;
        // Mutations and explicit refreshes invalidate data in other views too.
        for (const [key, load] of Object.entries(state.loads)) {
          if (load.status !== "loading") state.loads[key] = { status: "idle" };
        }
        const identity = loadResource("admin", { force: true });
        renderPreservingScroll();
        await identity;
        if (state.token && state.loads.admin?.status === "ready") {
          await loadView(state.activeView, { force: true });
        }
      }

      function renderLoadState() {
        const keys = ["admin", ...sourcesForView(state.activeView)];
        const failed = keys.filter((key) => state.loads[key]?.status === "error");
        const loading = keys.some((key) => ["idle", "loading"].includes(state.loads[key]?.status || "idle"));
        const busy = keys.some((key) => state.loads[key]?.status === "loading");
        if (failed.length) {
          setStatus("Could not load this section.");
          viewEl.innerHTML = `<section class="panel" role="alert">
            <h2>Could not load ${escapeHtml(viewTitleEl.textContent)}</h2>
            <p class="details">${failed.map((key) => escapeHtml(state.loads[key].message)).join("<br />")}</p>
            <button data-action="retry-data" type="button" ${busy ? "disabled" : ""}>Retry</button>
          </section>`;
          return true;
        }
        if (loading) {
          setStatus("Loading admin data...");
          viewEl.innerHTML = `<section class="panel" role="status" aria-live="polite">
            <p class="details">Loading ${escapeHtml(viewTitleEl.textContent)}...</p>
          </section>`;
          return true;
        }
        setStatus("");
        return false;
      }

      function renderNav() {
        navEl.innerHTML = views
          .filter(([key]) => canView(key))
          .map(([key, label], index) => {
            const title = index === 0 ? '<div class="nav-title">Main</div>' : "";
            const sectionTitle =
              key === "applications"
                ? '<div class="nav-title">Content</div>'
                : key === "users"
                  ? '<div class="nav-title">Users</div>'
                  : key === "discovery"
                    ? '<div class="nav-title">Discovery</div>'
                    : key === "settings"
                      ? '<div class="nav-title">System</div>'
                      : "";
            return `${title}${sectionTitle}<button class="${state.activeView === key ? "active" : "secondary"}" data-view="${key}" type="button">${label}</button>`;
          })
          .join("");
      }

      function setView(view) {
        if (!canView(view)) return setStatus("You do not have permission to open this section.");
        state.activeView = view;
        state.editingArtistId = null;
        state.editingSongId = null;
        state.editingGenreId = null;
        loadView(view).catch((error) => setStatus(error.message));
      }

      function render() {
        if (!state.token) {
          showLogin();
          return;
        }
        showAdmin();
        const isBoundedView = boundedViews.has(state.activeView);
        contentEl.classList.toggle("content-bounded", isBoundedView);
        viewEl.classList.toggle("split-view", isBoundedView);
        renderNav();
        const current = views.find(([key]) => key === state.activeView) || views[0];
        viewTitleEl.textContent = current[1];
        viewSubtitleEl.textContent = current[2];
        if (renderLoadState()) return;
        if (!canView(state.activeView)) {
          viewEl.innerHTML = '<p class="details">You do not have permission to open this section.</p>';
          return;
        }

        const renderers = {
          applications: renderApplications,
          artists: renderArtists,
          audit: renderAudit,
          catalog: renderCatalog,
          dashboard: renderDashboard,
          discovery: renderDiscovery,
          genres: renderGenres,
          health: renderHealth,
          releases: renderReleases,
          reports: renderReports,
          settings: renderSettings,
          support: renderSupport,
          users: renderUsers,
        };
        renderers[state.activeView]();
      }

      function rememberScrollPositions() {
        document.querySelectorAll("[data-scroll-key]").forEach((element) => {
          scrollMemory[element.dataset.scrollKey] = element.scrollTop;
        });
      }

      function restoreScrollPositions() {
        requestAnimationFrame(() => {
          document.querySelectorAll("[data-scroll-key]").forEach((element) => {
            const savedPosition = scrollMemory[element.dataset.scrollKey];
            if (typeof savedPosition === "number") {
              element.scrollTop = Math.min(savedPosition, element.scrollHeight);
            }
          });
        });
      }

      function renderPreservingScroll() {
        rememberScrollPositions();
        render();
        restoreScrollPositions();
      }

          ["Published Songs", metrics.total_published_songs],

          ["Total Plays", metrics.total_streams],
          ["New Users (7d)", metrics.new_users_7d],
          ["New Releases (7d)", metrics.new_releases_7d],
          ["Reports Needing Attention", metrics.reports_requiring_attention],

        viewEl.innerHTML = `
          <div class="stats">

      async function saveSettings(event) {
        event.preventDefault();
        const form = event.target;
        const data = new FormData(form);
        const previous = state.settings || {};
        const nextMaintenance = form.elements.maintenance_mode.checked;
        const nextRegistration = form.elements.registration_enabled.checked;

        if (!nextRegistration && previous.registration_enabled) {
          if (!confirm("Disable new user registration? Existing users can still login.")) return;
        }
        if (nextMaintenance && !previous.maintenance_mode) {
          if (!confirm("Enable maintenance mode for normal app users? Admin access will remain available.")) return;
        }

        const body = {
          registration_enabled: nextRegistration,
          artist_applications_enabled: form.elements.artist_applications_enabled.checked,
          music_uploads_enabled: form.elements.music_uploads_enabled.checked,
          maintenance_mode: nextMaintenance,
          max_audio_upload_mb: Number(data.get("max_audio_upload_mb") || 80),
          max_artwork_upload_mb: Number(data.get("max_artwork_upload_mb") || 10),
          supported_audio_formats: String(data.get("supported_audio_formats") || "")
            .split(",")
            .map((item) => item.trim())
            .filter(Boolean),
          minimum_supported_app_version: data.get("minimum_supported_app_version") || "",
          maintenance_message: data.get("maintenance_message") || "",
          app_announcement: data.get("app_announcement") || "",
          feature_flags: {
            artist_studio_enabled: form.elements.artist_studio_enabled.checked,
            offline_downloads_enabled: form.elements.offline_downloads_enabled.checked,
            playlists_enabled: form.elements.playlists_enabled.checked,
            registrations_enabled: nextRegistration,
            sharing_enabled: form.elements.sharing_enabled.checked,
          },
        };
        setStatus("Saving settings...");
        state.settings = await api("/admin-api/platform-settings", {
          method: "PUT",
          body: JSON.stringify(body),
        });
        await loadData();
        setStatus("Settings saved.");
      }

      async function downloadSupportAttachment(url, name) {
        if (!url) return;
        const response = await fetch(url, {
          headers: state.token ? { Authorization: `Bearer ${state.token}` } : {},
        });
        if (!response.ok) throw new Error("Could not open attachment.");
        const blob = await response.blob();
        const objectUrl = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = objectUrl;
        link.target = "_blank";
        link.rel = "noopener";
        link.download = name || "support-attachment";
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(objectUrl), 30000);
      }

      async function runAction(action, id, extra = {}) {
        const pathMap = {
          "approve-application": [`/admin-api/artist-applications/${id}/approve`, {}],
          "approve-release": [`/admin-api/releases/${id}/approve`, {}],
          "hide-song": [`/admin-api/songs/${id}/hide`, {}],
          "restore-song": [`/admin-api/songs/${id}/restore`, {}],
          "feature-song": [`/admin-api/songs/${id}/feature`, {}],
          "unfeature-song": [`/admin-api/songs/${id}/unfeature`, {}],
          "restore-artist": [`/admin-api/artists/${id}/restore`, {}],
          "feature-artist": [`/admin-api/artists/${id}/feature`, {}],
          "unfeature-artist": [`/admin-api/artists/${id}/unfeature`, {}],
          "restore-user": [`/admin-api/users/${id}/restore`, {}],
          "revoke-user-sessions": [`/admin-api/users/${id}/revoke-sessions`, {}],
          "activate-genre": [`/admin-api/genres/${id}/activate`, {}],
          "deactivate-genre": [`/admin-api/genres/${id}/deactivate`, {}],
        };
        const [path, body] = pathMap[action] || [];
        if (!path) return;
        await api(path, { method: "POST", body: JSON.stringify({ ...body, ...extra }) });
        await loadData();
      }

      async function handleAction(action, button) {
        const id = button.dataset.id;
        if (action === "retry-data") {
          return state.loads.admin?.status === "ready"
            ? loadView(state.activeView, { force: true })
            : loadData();
        }
        if (action === "cancel-artist") {
          state.editingArtistId = null;
          return renderPreservingScroll();
        }
        if (action === "cancel-song") {
          state.editingSongId = null;
          return renderPreservingScroll();
        }
        if (action === "cancel-genre") {
          state.editingGenreId = null;
          return renderPreservingScroll();
        }
        if (action === "edit-artist") {
          state.editingArtistId = Number(id);
          state.activeView = "artists";
          return renderPreservingScroll();
        }
        if (action === "edit-song") {
          state.editingSongId = Number(id);
          state.activeView = "catalog";
          return renderPreservingScroll();
        }
        if (action === "edit-genre") {
          state.editingGenreId = Number(id);
          state.activeView = "genres";
          return renderPreservingScroll();
        }
        if (action === "open-support") {
          state.activeView = "support";
          return openSupportTicket(id);
        }
        if (action === "refresh-support") {
          await refreshSupportTickets();
          return render();
        }
        if (action === "download-support-attachment") {
          return downloadSupportAttachment(button.dataset.url, button.dataset.name);
        }
        if (action === "reject-application" || action === "changes-application") {
          const reason = prompt(action === "reject-application" ? "Why is this application rejected?" : "What should the applicant change?");
          if (!reason) return;
          const endpoint = action === "reject-application" ? "reject" : "request-changes";
          await api(`/admin-api/artist-applications/${id}/${endpoint}`, {
            method: "POST",
            body: JSON.stringify({ reason }),
          });
          return loadData();
        }
        if (action === "reject-release" || action === "changes-release") {
          const reason = prompt(action === "reject-release" ? "Why is this release rejected?" : "What should the artist change?");
          if (!reason) return;
          const endpoint = action === "reject-release" ? "reject" : "request-changes";
          await api(`/admin-api/releases/${id}/${endpoint}`, {
            method: "POST",
            body: JSON.stringify({ reason }),
          });
          return loadData();
        }
        if (action === "remove-song") {
          const reason = prompt("Why should this song be removed from public availability?");
          if (!reason) return;
          await api(`/admin-api/songs/${id}/remove`, {
            method: "POST",
            body: JSON.stringify({ reason }),
          });
          return loadData();
        }
        if (action === "suspend-artist" || action === "suspend-user") {
          const reason = prompt("Enter a suspension reason.");
          if (!reason) return;
          const path = action === "suspend-artist" ? `/admin-api/artists/${id}/suspend` : `/admin-api/users/${id}/suspend`;
          await api(path, { method: "POST", body: JSON.stringify({ reason }) });
          return loadData();
        }
        if (action === "report-status") {
          const notes = prompt("Optional moderation note") || "";
          await api(`/admin-api/reports/${id}/status`, {
            method: "POST",
            body: JSON.stringify({ notes, status: button.dataset.status }),
          });
          return loadData();
        }
        if (action === "refresh-health") {
          return loadView("health", { force: true });
        }
        if (action === "refresh-audit") {
          return loadView("audit", { force: true });
        }
        if (action === "approve-application" && !confirm("Approve this artist application?")) return;
        if (action === "approve-release" && !confirm("Approve this release after listening?")) return;
        await runAction(action, id);
      }

        }
      });

      document.getElementById("refreshButton").addEventListener("click", () => {
        loadData().catch((error) => setStatus(error.message));
      });

      document.getElementById("logoutButton").addEventListener("click", async () => {
        try {
          await api("/admin-api/audio-preview-session", { method: "DELETE" });
        } catch {}
        state.token = "";
        localStorage.removeItem("tesoAdminToken");
        showLogin();
      });

      // Native audio controls use an HttpOnly, audio-only cookie, never a token URL.
      function renewAudioPreview() {
        if (state.token && document.visibilityState === "visible") {
          api("/admin-api/me", { suppressForbiddenLogout: true }).catch(() => {});
        }
      }
      setInterval(renewAudioPreview, 5 * 60 * 1000);
      document.addEventListener("visibilitychange", renewAudioPreview);

      if (state.token) {
        loadData().catch((error) => setStatus(error.message));
      } else {
        render();
      }
    </script>
  </body>
</html>
