<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Teso Tunes Admin</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #09090b;
        --card: #18181b;
        --elevated: #222226;
        --border: #2a2a31;
        --orange: #f97316;
        --yellow: #facc15;
        --text: #ffffff;
        --soft: #d4d4d8;
        --muted: #8a8a93;
      }
      * { box-sizing: border-box; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
      }
      button, input, select, textarea {
        font: inherit;
      }
      button {
        background: var(--orange);
        border: 0;
        border-radius: 8px;
        color: var(--text);
        cursor: pointer;
        font-weight: 900;
        min-height: 40px;
        padding: 0 14px;
      }
      button.secondary {
        background: var(--elevated);
        color: var(--soft);
      }
      button.danger {
        background: #dc2626;
      }
      input, select, textarea {
        background: #101014;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        min-height: 40px;
        padding: 10px;
        width: 100%;
      }
      label {
        color: var(--soft);
        display: grid;
        font-size: 13px;
        font-weight: 800;
        gap: 6px;
      }
      textarea {
        min-height: 96px;
        resize: vertical;
      }
      .app {
        margin: 0 auto;
        max-width: 1180px;
        padding: 22px;
      }
      .topbar {
        align-items: center;
        display: flex;
        gap: 16px;
        justify-content: space-between;
        margin-bottom: 20px;
      }
      .brand {
        display: grid;
        gap: 4px;
      }
      h1, h2, h3, p {
        margin: 0;
      }
      h1 {
        font-size: 30px;
        font-weight: 950;
      }
      .subtitle {
        color: var(--muted);
        font-size: 14px;
      }
      .tabs {
        display: flex;
        gap: 10px;
      }
      .tabs button {
        background: var(--elevated);
      }
      .tabs button.active {
        background: var(--orange);
      }
      .grid {
        display: grid;
        gap: 18px;
        grid-template-columns: minmax(300px, 0.9fr) minmax(0, 1.4fr);
      }
      .panel {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
      }
      .form {
        display: grid;
        gap: 12px;
      }
      .row {
        display: grid;
        gap: 12px;
        grid-template-columns: 1fr 1fr;
      }
      .check {
        align-items: center;
        display: flex;
        gap: 10px;
      }
      .check input {
        min-height: auto;
        width: auto;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .list {
        display: grid;
        gap: 10px;
      }
      .item {
        align-items: center;
        background: #101014;
        border: 1px solid var(--border);
        border-radius: 8px;
        display: grid;
        gap: 12px;
        grid-template-columns: 64px minmax(0, 1fr) auto;
        padding: 10px;
      }
      .thumb {
        background: var(--elevated);
        border-radius: 8px;
        height: 64px;
        object-fit: cover;
        width: 64px;
      }
      .item-title {
        font-weight: 900;
      }
      .meta {
        color: var(--muted);
        font-size: 13px;
        margin-top: 4px;
      }
      .login {
        margin: 12vh auto 0;
        max-width: 420px;
      }
      .status {
        color: var(--yellow);
        font-size: 13px;
        font-weight: 800;
        min-height: 18px;
      }
      @media (max-width: 820px) {
        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }
        .grid, .row {
          grid-template-columns: 1fr;
        }
        .item {
          grid-template-columns: 56px minmax(0, 1fr);
        }
        .item .actions {
          grid-column: 1 / -1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
      const { useEffect, useMemo, useState } = React;
      const categories = ["Rappers", "Other Secular Artists", "Gospel Artists"];
      const emptyArtist = { name: "", category: categories[0], bio: "", photo: "", location: "", is_featured: false };
      const emptySong = {
        artist: "",
        title: "",
        audio_file: "",
        cover_image: "",
        genre: "",
        lyrics: "",
        play_count: 0,
        release_date: "",
        is_featured: false,
      };

      function App() {
        const [token, setToken] = useState(localStorage.getItem("tesoAdminToken") || "");
        const [tab, setTab] = useState("songs");
        const [artists, setArtists] = useState([]);
        const [songs, setSongs] = useState([]);
        const [status, setStatus] = useState("");

        async function api(path, options = {}) {
          const response = await fetch(path, {
            ...options,
            headers: {
              ...(options.body instanceof FormData ? {} : { "Content-Type": "application/json" }),
              ...(token ? { Authorization: `Bearer ${token}` } : {}),
              ...(options.headers || {}),
            },
          });
          if (!response.ok) {
            const error = await response.json().catch(() => ({ detail: "Request failed." }));
            throw new Error(error.detail || "Request failed.");
          }
          return response.json();
        }

        async function load() {
          if (!token) return;
          const [artistData, songData] = await Promise.all([
            api("/admin-api/artists"),
            api("/admin-api/songs"),
          ]);
          setArtists(artistData);
          setSongs(songData);
        }

        useEffect(() => {
          load().catch((error) => setStatus(error.message));
        }, [token]);

        if (!token) {
          return <Login onLogin={(nextToken) => {
            localStorage.setItem("tesoAdminToken", nextToken);
            setToken(nextToken);
          }} />;
        }

        return (
          <main className="app">
            <div className="topbar">
              <div className="brand">
                <h1>Teso Tunes Admin</h1>
                <p className="subtitle">Admin-curated songs and artists only</p>
              </div>
              <div className="tabs">
                <button className={tab === "songs" ? "active" : ""} onClick={() => setTab("songs")}>Songs</button>
                <button className={tab === "artists" ? "active" : ""} onClick={() => setTab("artists")}>Artists</button>
                <button className="secondary" onClick={() => {
                  localStorage.removeItem("tesoAdminToken");
                  setToken("");
                }}>Logout</button>
              </div>
            </div>
            <p className="status">{status}</p>
            {tab === "songs" ? (
              <SongsAdmin api={api} artists={artists} songs={songs} reload={load} setStatus={setStatus} />
            ) : (
              <ArtistsAdmin api={api} artists={artists} reload={load} setStatus={setStatus} />
            )}
          </main>
        );
      }

      function Login({ onLogin }) {
        const [username, setUsername] = useState("admin");
        const [password, setPassword] = useState("");
        const [status, setStatus] = useState("");
        async function submit(event) {
          event.preventDefault();
          setStatus("Signing in...");
          const response = await fetch("/admin-api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });
          if (!response.ok) {
            setStatus("Invalid login.");
            return;
          }
          const data = await response.json();
          onLogin(data.token);
        }
        return (
          <main className="app">
            <section className="panel login">
              <form className="form" onSubmit={submit}>
                <h1>Teso Tunes Admin</h1>
                <p className="subtitle">Use your admin login to manage songs and artists.</p>
                <label>Username<input value={username} onChange={(event) => setUsername(event.target.value)} /></label>
                <label>Password<input type="password" value={password} onChange={(event) => setPassword(event.target.value)} /></label>
                <button type="submit">Login</button>
                <p className="status">{status}</p>
              </form>
            </section>
          </main>
        );
      }

      function ArtistsAdmin({ api, artists, reload, setStatus }) {
        const [form, setForm] = useState(emptyArtist);
        const [editingId, setEditingId] = useState(null);
        async function submit(event) {
          event.preventDefault();
          const body = new FormData(event.currentTarget);
          setStatus("Saving artist...");
          await api(editingId ? `/admin-api/artists/${editingId}` : "/admin-api/artists", {
            method: editingId ? "PUT" : "POST",
            body,
          });
          event.currentTarget.reset();
          setForm(emptyArtist);
          setEditingId(null);
          await reload();
          setStatus("Artist saved.");
        }
        return (
          <div className="grid">
            <section className="panel">
              <form className="form" onSubmit={submit}>
                <h2>{editingId ? "Edit artist" : "Add artist"}</h2>
                <label>Name<input name="name" value={form.name} onChange={(event) => setForm({ ...form, name: event.target.value })} required /></label>
                <label>Category<select name="category" value={form.category} onChange={(event) => setForm({ ...form, category: event.target.value })}>{categories.map((item) => <option key={item}>{item}</option>)}</select></label>
                <label>Location<input name="location" value={form.location} onChange={(event) => setForm({ ...form, location: event.target.value })} /></label>
                <label>Photo URL<input name="photo" value={form.photo} onChange={(event) => setForm({ ...form, photo: event.target.value })} /></label>
                <label>Choose photo image<input name="photo_file" type="file" accept="image/*" /></label>
                <label>Bio<textarea name="bio" value={form.bio} onChange={(event) => setForm({ ...form, bio: event.target.value })}></textarea></label>
                <label className="check"><input name="is_featured" type="checkbox" checked={form.is_featured} onChange={(event) => setForm({ ...form, is_featured: event.target.checked })} /> Featured artist</label>
                <div className="actions">
                  <button type="submit">Save Artist</button>
                  {editingId && <button type="button" className="secondary" onClick={() => { setEditingId(null); setForm(emptyArtist); }}>Cancel</button>}
                </div>
              </form>
            </section>
            <section className="panel list">
              <h2>Artists</h2>
              {artists.map((artist) => (
                <div className="item" key={artist.id}>
                  <img className="thumb" src={artist.photo || ""} />
                  <div>
                    <div className="item-title">{artist.name}</div>
                    <div className="meta">{artist.category} - {artist.follower_count} followers - {artist.song_count} songs</div>
                  </div>
                  <div className="actions">
                    <button className="secondary" onClick={() => {
                      setEditingId(artist.id);
                      setForm({ ...artist, photo: artist.photo || "" });
                    }}>Edit</button>
                    <button className="danger" onClick={async () => {
                      if (!confirm("Delete this artist and their songs?")) return;
                      await api(`/admin-api/artists/${artist.id}`, { method: "DELETE" });
                      await reload();
                    }}>Delete</button>
                  </div>
                </div>
              ))}
            </section>
          </div>
        );
      }

      function SongsAdmin({ api, artists, songs, reload, setStatus }) {
        const [form, setForm] = useState(emptySong);
        const [editingId, setEditingId] = useState(null);
        const artistMap = useMemo(() => Object.fromEntries(artists.map((artist) => [artist.id, artist.name])), [artists]);
        async function submit(event) {
          event.preventDefault();
          const body = new FormData(event.currentTarget);
          setStatus("Saving song...");
          await api(editingId ? `/admin-api/songs/${editingId}` : "/admin-api/songs", {
            method: editingId ? "PUT" : "POST",
            body,
          });
          event.currentTarget.reset();
          setForm(emptySong);
          setEditingId(null);
          await reload();
          setStatus("Song saved.");
        }
        return (
          <div className="grid">
            <section className="panel">
              <form className="form" onSubmit={submit}>
                <h2>{editingId ? "Edit song" : "Add song"}</h2>
                <label>Title<input name="title" value={form.title} onChange={(event) => setForm({ ...form, title: event.target.value })} required /></label>
                <label>Artist<select name="artist" value={form.artist} onChange={(event) => setForm({ ...form, artist: event.target.value })} required><option value="">Choose artist</option>{artists.map((artist) => <option key={artist.id} value={artist.id}>{artist.name}</option>)}</select></label>
                <div className="row">
                  <label>Genre<input name="genre" value={form.genre} onChange={(event) => setForm({ ...form, genre: event.target.value })} /></label>
                  <label>Release date<input name="release_date" type="date" value={form.release_date || ""} onChange={(event) => setForm({ ...form, release_date: event.target.value })} /></label>
                </div>
                <label>Audio URL<input name="audio_file" value={form.audio_file} onChange={(event) => setForm({ ...form, audio_file: event.target.value })} /></label>
                <label>Choose audio file<input name="audio_upload" type="file" accept="audio/*" /></label>
                <label>Cover URL<input name="cover_image" value={form.cover_image} onChange={(event) => setForm({ ...form, cover_image: event.target.value })} /></label>
                <label>Choose cover image<input name="cover_upload" type="file" accept="image/*" /></label>
                <label>Lyrics<textarea name="lyrics" value={form.lyrics} onChange={(event) => setForm({ ...form, lyrics: event.target.value })}></textarea></label>
                <label className="check"><input name="is_featured" type="checkbox" checked={form.is_featured} onChange={(event) => setForm({ ...form, is_featured: event.target.checked })} /> Featured song</label>
                <input name="play_count" type="hidden" value={form.play_count || 0} readOnly />
                <div className="actions">
                  <button type="submit">Save Song</button>
                  {editingId && <button type="button" className="secondary" onClick={() => { setEditingId(null); setForm(emptySong); }}>Cancel</button>}
                </div>
              </form>
            </section>
            <section className="panel list">
              <h2>Songs</h2>
              {songs.map((song) => (
                <div className="item" key={song.id}>
                  <img className="thumb" src={song.cover_image || ""} />
                  <div>
                    <div className="item-title">{song.title}</div>
                    <div className="meta">{artistMap[song.artist] || song.artist_name} - {song.like_count} likes - {song.genre || "Teso music"}</div>
                  </div>
                  <div className="actions">
                    <button className="secondary" onClick={() => {
                      setEditingId(song.id);
                      setForm({
                        ...song,
                        artist: String(song.artist),
                        release_date: song.release_date || "",
                        audio_file: song.audio_file || "",
                        cover_image: song.cover_image || "",
                      });
                    }}>Edit</button>
                    <button className="danger" onClick={async () => {
                      if (!confirm("Delete this song?")) return;
                      await api(`/admin-api/songs/${song.id}`, { method: "DELETE" });
                      await reload();
                    }}>Delete</button>
                  </div>
                </div>
              ))}
            </section>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
