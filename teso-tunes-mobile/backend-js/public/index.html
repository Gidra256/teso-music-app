      }

      async function saveSong(event) {
        event.preventDefault();
        const form = event.target;
        setStatus("Saving song...");
        await api(state.editingSongId ? `/admin-api/songs/${state.editingSongId}` : "/admin-api/songs", {
          method: state.editingSongId ? "PUT" : "POST",
          body: new FormData(form),
        });
        state.editingSongId = null;
        await loadData();
        setStatus("Song saved.");
      }

      async function saveGenre(event) {
        event.preventDefault();
        const form = event.target;
        const data = Object.fromEntries(new FormData(form).entries());
        setStatus("Saving genre...");
        await api(state.editingGenreId ? `/admin-api/genres/${state.editingGenreId}` : "/admin-api/genres", {
          method: state.editingGenreId ? "PUT" : "POST",
          body: JSON.stringify(data),
        });
        state.editingGenreId = null;
        await loadData();
        setStatus("Genre saved.");
      }

      async function saveSettings(event) {
        event.preventDefault();
        const form = event.target;
        const data = new FormData(form);
        const previous = state.settings || {};
        const nextMaintenance = form.elements.maintenance_mode.checked;
        const nextRegistration = form.elements.registration_enabled.checked;

        if (!nextRegistration && previous.registration_enabled) {
          if (!confirm("Disable new user registration? Existing users can still login.")) return;
        }
        if (nextMaintenance && !previous.maintenance_mode) {
          if (!confirm("Enable maintenance mode for normal app users? Admin access will remain available.")) return;
        }

        const body = {
          registration_enabled: nextRegistration,
          artist_applications_enabled: form.elements.artist_applications_enabled.checked,
          music_uploads_enabled: form.elements.music_uploads_enabled.checked,
          maintenance_mode: nextMaintenance,
          max_audio_upload_mb: Number(data.get("max_audio_upload_mb") || 80),
          max_artwork_upload_mb: Number(data.get("max_artwork_upload_mb") || 10),
          supported_audio_formats: String(data.get("supported_audio_formats") || "")
            .split(",")
            .map((item) => item.trim())
            .filter(Boolean),
          minimum_supported_app_version: data.get("minimum_supported_app_version") || "",
          maintenance_message: data.get("maintenance_message") || "",
          app_announcement: data.get("app_announcement") || "",
          feature_flags: {
            artist_studio_enabled: form.elements.artist_studio_enabled.checked,
            offline_downloads_enabled: form.elements.offline_downloads_enabled.checked,
            playlists_enabled: form.elements.playlists_enabled.checked,
            registrations_enabled: nextRegistration,
            sharing_enabled: form.elements.sharing_enabled.checked,
          },
        };
        setStatus("Saving settings...");
        state.settings = await api("/admin-api/platform-settings", {
          method: "PUT",
          body: JSON.stringify(body),
        });
        await loadData();
        setStatus("Settings saved.");
      }

      async function refreshSupportTickets() {
        const loading = loadResource("supportTickets", { force: true });
        renderPreservingScroll();
        await loading;
      }

      async function openSupportTicket(id) {
        state.activeSupportTicket = await api(`/admin-api/support/tickets/${id}`);
        await refreshSupportTickets();
        renderPreservingScroll();
      }

      async function saveSupportUpdate(event) {
        event.preventDefault();
        const form = event.target;
        const data = Object.fromEntries(new FormData(form).entries());
        setStatus("Updating support ticket...");
        state.activeSupportTicket = await api(`/admin-api/support/tickets/${form.dataset.ticketId}`, {
          method: "PATCH",
          body: JSON.stringify({
            assigned_to: data.assigned_to || "",
            priority: data.priority,
            status: data.status,
          }),
        });
        await refreshSupportTickets();
        renderPreservingScroll();
        setStatus("Support ticket updated.");
      }

      async function saveSupportReply(event) {
        event.preventDefault();
        const form = event.target;
        const message = new FormData(form).get("message") || "";
        if (!String(message).trim()) return setStatus("Enter a public reply.");
        setStatus("Sending public reply...");
        state.activeSupportTicket = await api(`/admin-api/support/tickets/${form.dataset.ticketId}/replies`, {
          method: "POST",
          body: JSON.stringify({ message }),
        });
        form.reset();
        await refreshSupportTickets();
        renderPreservingScroll();
        setStatus("Public reply sent.");
      }

      async function saveSupportNote(event) {
        event.preventDefault();
        const form = event.target;
        const note = new FormData(form).get("note") || "";
        if (!String(note).trim()) return setStatus("Enter an internal note.");
        setStatus("Adding internal note...");
        state.activeSupportTicket = await api(`/admin-api/support/tickets/${form.dataset.ticketId}/notes`, {
          method: "POST",
          body: JSON.stringify({ note }),
        });
        form.reset();
        await refreshSupportTickets();
        renderPreservingScroll();
        setStatus("Internal note added.");
      }

      async function downloadSupportAttachment(url, name) {
        if (!url) return;
        const response = await fetch(url, {
          credentials: "same-origin",
          headers: { "X-Teso-Admin": "1" },
        });
        if (!response.ok) throw new Error("Could not open attachment.");
        const blob = await response.blob();
        const objectUrl = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = objectUrl;
        link.target = "_blank";
        link.rel = "noopener";
        link.download = name || "support-attachment";
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(objectUrl), 30000);
      }

      async function runAction(action, id, extra = {}) {
        const pathMap = {
          "hide-song": [`/admin-api/songs/${id}/hide`, {}],
          "restore-song": [`/admin-api/songs/${id}/restore`, {}],
          "feature-song": [`/admin-api/songs/${id}/feature`, {}],
          "unfeature-song": [`/admin-api/songs/${id}/unfeature`, {}],
          "restore-artist": [`/admin-api/artists/${id}/restore`, {}],
          "feature-artist": [`/admin-api/artists/${id}/feature`, {}],
          "unfeature-artist": [`/admin-api/artists/${id}/unfeature`, {}],
          "restore-user": [`/admin-api/users/${id}/restore`, {}],
          "revoke-user-sessions": [`/admin-api/users/${id}/revoke-sessions`, {}],
          "activate-genre": [`/admin-api/genres/${id}/activate`, {}],
          "deactivate-genre": [`/admin-api/genres/${id}/deactivate`, {}],
        };
        const [path, body] = pathMap[action] || [];
        if (!path) return;
        await api(path, { method: "POST", body: JSON.stringify({ ...body, ...extra }) });
        await loadData();
      }

      async function handleAction(action, button) {
        const id = button.dataset.id;
        if (["approve-release", "reject-release", "changes-release"].includes(action)) return reviewRelease(action, id);
        if (action === "review-release") return openRelease(id);
        if (action === "back-releases") { state.activeReleaseId = null; return loadView("releases", {force:true}); }
        if (action === "refresh-releases") return loadView("releases", {force:true});
        if (action === "clear-release-filters") { state.filters.releaseSearch = ""; state.filters.releaseStatus = ""; state.filters.releasePublication = ""; return renderReleases(); }
        if (action === "retry-release-audio") {
          await api("/admin-api/me");
          document.getElementById("releaseAudio")?.load();
          return;
        }
        if (["approve-application", "reject-application", "changes-application"].includes(action)) return reviewApplication(action, id);
        if (action === "review-application") return openApplication(id);
        if (action === "back-applications") { state.activeApplicationId = null; return loadView("applications", {force:true}); }
        if (action === "refresh-applications") return loadView("applications", {force:true});
        if (action === "application-logout") return document.getElementById("logoutButton").click();
        if (action === "clear-application-filters") {
          state.filters.applicationSearch = ""; state.filters.applicationStatus = ""; return renderApplications();
        }
        if (action === "retry-data") {
          return state.loads.admin?.status === "ready"
            ? loadView(state.activeView, { force: true })
            : loadData();
        }
        if (action === "cancel-artist") {
          state.editingArtistId = null;
          return renderPreservingScroll();
        }
        if (action === "cancel-song") {
          state.editingSongId = null;
          return renderPreservingScroll();
        }
        if (action === "cancel-genre") {
          state.editingGenreId = null;
          return renderPreservingScroll();
        }
        if (action === "edit-artist") {
          state.editingArtistId = Number(id);
          state.activeView = "artists";
          return renderPreservingScroll();
        }
        if (action === "edit-song") {
          state.editingSongId = Number(id);
          state.activeView = "catalog";
          return renderPreservingScroll();
        }
        if (action === "edit-genre") {
          state.editingGenreId = Number(id);
          state.activeView = "genres";
          return renderPreservingScroll();
        }
        if (action === "open-support") {
          state.activeView = "support";
          return openSupportTicket(id);
        }
        if (action === "refresh-support") {
          await refreshSupportTickets();
          return render();
        }
        if (action === "download-support-attachment") {
          return downloadSupportAttachment(button.dataset.url, button.dataset.name);
        }
        if (action === "remove-song") {
          const reason = prompt("Why should this song be removed from public availability?");
          if (!reason) return;
          await api(`/admin-api/songs/${id}/remove`, {
            method: "POST",
            body: JSON.stringify({ reason }),
          });
          return loadData();
        }
        if (action === "suspend-artist" || action === "suspend-user") {
          const reason = prompt("Enter a suspension reason.");
          if (!reason) return;
          const path = action === "suspend-artist" ? `/admin-api/artists/${id}/suspend` : `/admin-api/users/${id}/suspend`;
          await api(path, { method: "POST", body: JSON.stringify({ reason }) });
          return loadData();
        }
        if (action === "report-status") {
          const notes = prompt("Optional moderation note") || "";
          await api(`/admin-api/reports/${id}/status`, {
            method: "POST",
            body: JSON.stringify({ notes, status: button.dataset.status }),
          });
          return loadData();
        }
        if (action === "refresh-health") {
          return loadView("health", { force: true });
        }
        if (action === "refresh-audit") {
          return loadView("audit", { force: true });
        }
        await runAction(action, id);
      }

      document.getElementById("loginForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        if (form.dataset.pending) return;
        form.dataset.pending = "1";
        const button = form.querySelector('button[type="submit"]');
        button.disabled = true;
        loginStatusEl.textContent = "Signing in...";
        try {
          const payload = JSON.stringify({username:document.getElementById("loginUsername").value,password:document.getElementById("loginPassword").value});
          document.getElementById("loginPassword").value = "";
          const data = await api(document.getElementById("recoveryLogin").checked ? "/admin-api/break-glass-login" : "/admin-api/login", {
            method: "POST",
            body: payload,
          });
          state.token = `cookie-session-${Date.now()}`;
          state.admin = data.admin;
          state.loads = {};
          loginStatusEl.textContent = "";
          await loadData();
        } catch (error) {
          loginStatusEl.textContent = error.message;
        } finally { delete form.dataset.pending; button.disabled = false; }
      });

      document.addEventListener("click", async (event) => {
        const pageButton = event.target.closest("[data-page-key]");
        if (pageButton) {
          changeListPage(pageButton);
          return;
        }
        const viewButton = event.target.closest("[data-view]");
        if (viewButton) {
          setView(viewButton.dataset.view);
          return;
        }

        const actionButton = event.target.closest("[data-action]");
        if (actionButton) {
          try {
            actionButton.disabled = true;
            setStatus("Working...");
            await handleAction(actionButton.dataset.action, actionButton);
            setStatus("");
          } catch (error) {
            setStatus(error.message);
          } finally {
            actionButton.disabled = false;
          }
        }
      });

      document.addEventListener("input", (event) => {
        if (event.target.matches("[data-artist-options]")) {
          const select = document.querySelector('#songForm select[name="artist"]');
          select.innerHTML = artistChoiceOptions(select.value, event.target.value);
          return;
        }
        const filter = event.target.dataset.filter;
        if (!filter) return;
        state.filters[filter] = event.target.value;
        if (["applicationSearch", "applicationStatus"].includes(filter)) return updateApplicationResults();
        if (["releaseSearch", "releaseStatus", "releasePublication"].includes(filter)) return updateReleaseResults();
        if (["artistSearch", "artistStatus"].includes(filter)) return updateCollectionResults("artist");
        if (["catalogSearch", "catalogStatus"].includes(filter)) return updateCollectionResults("catalog");
        renderPreservingScroll();
      });

      document.addEventListener("change", (event) => {
        const filter = event.target.dataset.filter;
        if (!filter) return;
        if (state.filters[filter] === event.target.value) return;
        state.filters[filter] = event.target.value;
        if (["applicationSearch", "applicationStatus"].includes(filter)) return updateApplicationResults();
        if (["releaseSearch", "releaseStatus", "releasePublication"].includes(filter)) return updateReleaseResults();
        if (["artistSearch", "artistStatus"].includes(filter)) return updateCollectionResults("artist");
        if (["catalogSearch", "catalogStatus"].includes(filter)) return updateCollectionResults("catalog");
        renderPreservingScroll();
      });

      document.addEventListener("submit", async (event) => {
        try {
          if (event.target.matches("[data-admin-form]")) return await saveAdminForm(event);
          if (event.target.id === "artistForm") return await saveArtist(event);
          if (event.target.id === "songForm") return await saveSong(event);
          if (event.target.id === "genreForm") return await saveGenre(event);
          if (event.target.id === "settingsForm") return await saveSettings(event);
          if (event.target.id === "supportUpdateForm") return await saveSupportUpdate(event);
          if (event.target.id === "supportReplyForm") return await saveSupportReply(event);
          if (event.target.id === "supportNoteForm") return await saveSupportNote(event);
        } catch (error) {
          event.preventDefault();
          setStatus(error.message);
        }
      });

      document.getElementById("refreshButton").addEventListener("click", () => {
        loadData().then(() => {
          if (state.activeView === "applications" && state.activeApplicationId !== null) return openApplication(state.activeApplicationId);
          if (state.activeView === "releases" && state.activeReleaseId !== null) return openRelease(state.activeReleaseId);
        }).catch((error) => setStatus(error.message));
      });

      document.getElementById("logoutButton").addEventListener("click", async () => {
        try {
          await api("/admin-api/logout", { method: "POST" });
        } catch (error) { setStatus("Logout failed. Retry to end your server session."); return; }
        state.token = "";
        state.admin = null;
        state.loads = {};
        localStorage.removeItem("tesoAdminToken");
        showLogin();
      });

      // Native audio controls use an HttpOnly, audio-only cookie, never a token URL.
      function renewAudioPreview() {
        if (state.token && document.visibilityState === "visible") {
          api("/admin-api/me", { suppressForbiddenLogout: true }).catch(() => {});
        }
      }
      setInterval(renewAudioPreview, 5 * 60 * 1000);
      document.addEventListener("visibilitychange", renewAudioPreview);

      localStorage.removeItem("tesoAdminToken");
      if (state.token) {
        loadData().catch((error) => setStatus(error.message));
      } else {
        render();
      }
    </script>
  </body>
</html>
