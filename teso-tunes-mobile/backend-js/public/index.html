<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Teso Tunes Admin</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #09090b;
        --card: #18181b;
        --elevated: #222226;
        --border: #2a2a31;
        --orange: #20e6f3;
        --yellow: #f427c8;
        --text: #ffffff;
        --soft: #d4d4d8;
        --muted: #8a8a93;
        --danger: #dc2626;
      }

      * {
        box-sizing: border-box;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        background: var(--orange);
        border: 0;
        border-radius: 8px;
        color: var(--text);
        cursor: pointer;
        font-weight: 900;
        min-height: 40px;
        padding: 0 14px;
      }

      button.secondary {
        background: var(--elevated);
        color: var(--soft);
      }

      button.danger {
        background: var(--danger);
      }

      button.active {
        background: var(--orange);
      }

      input,
      select,
      textarea {
        background: #101014;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        min-height: 40px;
        padding: 10px;
        width: 100%;
      }

      input[type="checkbox"] {
        min-height: auto;
        width: auto;
      }

      label {
        color: var(--soft);
        display: grid;
        font-size: 13px;
        font-weight: 800;
        gap: 6px;
      }

      textarea {
        min-height: 110px;
        resize: vertical;
      }

      .app {
        margin: 0 auto;
        max-width: 1180px;
        padding: 22px;
      }

      .topbar {
        align-items: center;
        display: flex;
        gap: 16px;
        justify-content: space-between;
        margin-bottom: 18px;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font-size: 30px;
        font-weight: 950;
      }

      h2 {
        font-size: 20px;
      }

      .subtitle {
        color: var(--muted);
        font-size: 14px;
        margin-top: 4px;
      }

      .tabs,
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .tabs button {
        background: var(--elevated);
      }

      .grid {
        display: grid;
        gap: 18px;
        grid-template-columns: minmax(300px, 0.9fr) minmax(0, 1.4fr);
      }

      .panel {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
      }

      .form {
        display: grid;
        gap: 12px;
      }

      .row {
        display: grid;
        gap: 12px;
        grid-template-columns: 1fr 1fr;
      }

      .check {
        align-items: center;
        display: flex;
        gap: 10px;
      }

      .list {
        display: grid;
        gap: 10px;
      }

      .item {
        align-items: center;
        background: #101014;
        border: 1px solid var(--border);
        border-radius: 8px;
        display: grid;
        gap: 12px;
        grid-template-columns: 64px minmax(0, 1fr) auto;
        padding: 10px;
      }

      .thumb {
        background: var(--elevated);
        border-radius: 8px;
        height: 64px;
        object-fit: cover;
        width: 64px;
      }

      .item-title {
        font-weight: 900;
      }

      .details {
        color: var(--soft);
        font-size: 13px;
        line-height: 1.55;
        margin-top: 8px;
      }

      .badge {
        background: rgba(32, 230, 243, 0.12);
        border: 1px solid rgba(32, 230, 243, 0.28);
        border-radius: 999px;
        color: var(--orange);
        display: inline-flex;
        font-size: 12px;
        font-weight: 900;
        padding: 4px 8px;
        text-transform: uppercase;
      }

      .wide-item {
        align-items: flex-start;
        grid-template-columns: 84px minmax(0, 1fr) auto;
      }

      .wide-item .thumb {
        height: 84px;
        width: 84px;
      }

      audio {
        margin-top: 10px;
        max-width: 100%;
        width: 360px;
      }

      .meta {
        color: var(--muted);
        font-size: 13px;
        margin-top: 4px;
      }

      .login {
        margin: 12vh auto 0;
        max-width: 420px;
      }

      .status {
        color: var(--yellow);
        font-size: 13px;
        font-weight: 800;
        min-height: 18px;
        margin-bottom: 12px;
      }

      .hidden {
        display: none;
      }

      @media (max-width: 820px) {
        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }

        .grid,
        .row {
          grid-template-columns: 1fr;
        }

        .item {
          grid-template-columns: 56px minmax(0, 1fr);
        }

        .item .actions {
          grid-column: 1 / -1;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section id="loginPanel" class="panel login">
        <form id="loginForm" class="form">
          <h1>Teso Tunes Admin</h1>
          <p class="subtitle">Manage songs, artists, covers, lyrics, and featured content.</p>
          <label>Username<input id="loginUsername" value="admin" autocomplete="username" /></label>
          <label>Password<input id="loginPassword" type="password" autocomplete="current-password" /></label>
          <button type="submit">Login</button>
          <p id="loginStatus" class="status"></p>
        </form>
      </section>

      <section id="adminPanel" class="hidden">
        <div class="topbar">
          <div>
            <h1>Teso Tunes Admin</h1>
            <p class="subtitle">Admin-curated music library and artist moderation</p>
          </div>
          <div class="tabs">
            <button id="songsTab" class="active" type="button">Songs</button>
            <button id="artistsTab" type="button">Artists</button>
            <button id="applicationsTab" type="button">Applications</button>
            <button id="releasesTab" type="button">Releases</button>
            <button id="logoutButton" class="secondary" type="button">Logout</button>
          </div>
        </div>
        <p id="status" class="status"></p>
        <div id="songsView"></div>
        <div id="artistsView" class="hidden"></div>
        <div id="applicationsView" class="hidden"></div>
        <div id="releasesView" class="hidden"></div>
      </section>
    </main>

    <script>
      const categories = ["Rappers", "Other Secular Artists", "Gospel Artists"];
      let token = localStorage.getItem("tesoAdminToken") || "";
      let applications = [];
      let artists = [];
      let releases = [];
      let songs = [];
      let activeTab = "songs";
      let editingArtistId = null;
      let editingSongId = null;

      const loginPanel = document.getElementById("loginPanel");
      const adminPanel = document.getElementById("adminPanel");
      const statusEl = document.getElementById("status");
      const loginStatusEl = document.getElementById("loginStatus");
      const songsView = document.getElementById("songsView");
      const artistsView = document.getElementById("artistsView");
      const applicationsView = document.getElementById("applicationsView");
      const releasesView = document.getElementById("releasesView");
      const songsTab = document.getElementById("songsTab");
      const artistsTab = document.getElementById("artistsTab");
      const applicationsTab = document.getElementById("applicationsTab");
      const releasesTab = document.getElementById("releasesTab");

      function setStatus(message) {
        statusEl.textContent = message || "";
      }

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      async function api(path, options = {}) {
        const headers = {
          ...(options.body instanceof FormData ? {} : { "Content-Type": "application/json" }),
          ...(token ? { Authorization: `Bearer ${token}` } : {}),
          ...(options.headers || {}),
        };
        const response = await fetch(path, { ...options, headers });
        if (!response.ok) {
          const error = await response.json().catch(() => ({ detail: "Request failed." }));
          throw new Error(error.detail || "Request failed.");
        }
        return response.json();
      }

      async function loadData() {
        if (!token) return;
        [artists, songs, applications, releases] = await Promise.all([
          api("/admin-api/artists"),
          api("/admin-api/songs"),
          api("/admin-api/artist-applications"),
          api("/admin-api/releases"),
        ]);
        render();
      }

      function showAdmin() {
        loginPanel.classList.add("hidden");
        adminPanel.classList.remove("hidden");
      }

      function showLogin() {
        adminPanel.classList.add("hidden");
        loginPanel.classList.remove("hidden");
      }

      function switchTab(tab) {
        activeTab = tab;
        songsTab.classList.toggle("active", tab === "songs");
        artistsTab.classList.toggle("active", tab === "artists");
        applicationsTab.classList.toggle("active", tab === "applications");
        releasesTab.classList.toggle("active", tab === "releases");
        songsView.classList.toggle("hidden", tab !== "songs");
        artistsView.classList.toggle("hidden", tab !== "artists");
        applicationsView.classList.toggle("hidden", tab !== "applications");
        releasesView.classList.toggle("hidden", tab !== "releases");
        render();
      }

      function artistOptions(selectedId) {
        return [
          '<option value="">Choose artist</option>',
          ...artists.map((artist) => {
            const selected = String(artist.id) === String(selectedId) ? "selected" : "";
            return `<option value="${artist.id}" ${selected}>${escapeHtml(artist.name)}</option>`;
          }),
        ].join("");
      }

      function categoryOptions(selectedCategory) {
        return categories
          .map((category) => {
            const selected = category === selectedCategory ? "selected" : "";
            return `<option ${selected}>${escapeHtml(category)}</option>`;
          })
          .join("");
      }

      function renderArtists() {
        const editing = artists.find((artist) => artist.id === editingArtistId) || {
          name: "",
          category: categories[0],
          bio: "",
          photo: "",
          location: "",
          is_featured: false,
        };

        artistsView.innerHTML = `
          <div class="grid">
            <section class="panel">
              <form id="artistForm" class="form">
                <h2>${editingArtistId ? "Edit artist" : "Add artist"}</h2>
                <label>Name<input name="name" value="${escapeHtml(editing.name)}" required /></label>
                <label>Category<select name="category">${categoryOptions(editing.category)}</select></label>
                <label>Location<input name="location" value="${escapeHtml(editing.location)}" /></label>
                <label>Photo URL<input name="photo" value="${escapeHtml(editing.photo)}" /></label>
                <label>Choose photo image<input name="photo_file" type="file" accept="image/*" /></label>
                <label>Bio<textarea name="bio">${escapeHtml(editing.bio)}</textarea></label>
                <label class="check"><input name="is_featured" type="checkbox" ${editing.is_featured ? "checked" : ""} /> Featured artist</label>
                <div class="actions">
                  <button type="submit">Save Artist</button>
                  ${editingArtistId ? '<button id="cancelArtist" class="secondary" type="button">Cancel</button>' : ""}
                </div>
              </form>
            </section>
            <section class="panel list">
              <h2>Artists</h2>
              ${artists
                .map(
                  (artist) => `
                    <div class="item">
                      <img class="thumb" src="${escapeHtml(artist.photo)}" alt="" />
                      <div>
                        <div class="item-title">${escapeHtml(artist.name)}</div>
                        <div class="meta">${escapeHtml(artist.category)} - ${artist.follower_count || 0} followers - ${artist.song_count || 0} songs</div>
                      </div>
                      <div class="actions">
                        <button class="secondary edit-artist" data-id="${artist.id}" type="button">Edit</button>
                        <button class="danger delete-artist" data-id="${artist.id}" type="button">Delete</button>
                      </div>
                    </div>`
                )
                .join("")}
            </section>
          </div>
        `;

        document.getElementById("artistForm").addEventListener("submit", saveArtist);
        document.getElementById("cancelArtist")?.addEventListener("click", () => {
          editingArtistId = null;
          renderArtists();
        });
        document.querySelectorAll(".edit-artist").forEach((button) => {
          button.addEventListener("click", () => {
            editingArtistId = Number(button.dataset.id);
            renderArtists();
          });
        });
        document.querySelectorAll(".delete-artist").forEach((button) => {
          button.addEventListener("click", () => deleteArtist(Number(button.dataset.id)));
        });
      }

      function renderSongs() {
        const editing = songs.find((song) => song.id === editingSongId) || {
          artist: "",
          title: "",
          audio_file: "",
          cover_image: "",
          genre: "",
          lyrics: "",
          play_count: 0,
          release_date: "",
          is_featured: false,
        };

        songsView.innerHTML = `
          <div class="grid">
            <section class="panel">
              <form id="songForm" class="form">
                <h2>${editingSongId ? "Edit song" : "Add song"}</h2>
                <label>Title<input name="title" value="${escapeHtml(editing.title)}" required /></label>
                <label>Artist<select name="artist" required>${artistOptions(editing.artist)}</select></label>
                <div class="row">
                  <label>Genre<input name="genre" value="${escapeHtml(editing.genre)}" /></label>
                  <label>Release date<input name="release_date" type="date" value="${escapeHtml(editing.release_date || "")}" /></label>
                </div>
                <label>Audio URL<input name="audio_file" value="${escapeHtml(editing.audio_file)}" /></label>
                <label>Choose audio file<input name="audio_upload" type="file" accept="audio/*" /></label>
                <label>Cover URL<input name="cover_image" value="${escapeHtml(editing.cover_image)}" /></label>
                <label>Choose cover image<input name="cover_upload" type="file" accept="image/*" /></label>
                <label>Lyrics<textarea name="lyrics">${escapeHtml(editing.lyrics)}</textarea></label>
                <label class="check"><input name="is_featured" type="checkbox" ${editing.is_featured ? "checked" : ""} /> Featured song</label>
                <input name="play_count" type="hidden" value="${Number(editing.play_count || 0)}" />
                <div class="actions">
                  <button type="submit">Save Song</button>
                  ${editingSongId ? '<button id="cancelSong" class="secondary" type="button">Cancel</button>' : ""}
                </div>
              </form>
            </section>
            <section class="panel list">
              <h2>Songs</h2>
              ${songs
                .map(
                  (song) => `
                    <div class="item">
                      <img class="thumb" src="${escapeHtml(song.cover_image)}" alt="" />
                      <div>
                        <div class="item-title">${escapeHtml(song.title)}</div>
                        <div class="meta">${escapeHtml(song.artist_name)} - ${Number(song.play_count || 0).toLocaleString()} plays - ${song.like_count || 0} likes - ${escapeHtml(song.genre || "Teso music")}</div>
                      </div>
                      <div class="actions">
                        <button class="secondary edit-song" data-id="${song.id}" type="button">Edit</button>
                        <button class="danger delete-song" data-id="${song.id}" type="button">Delete</button>
                      </div>
                    </div>`
                )
                .join("")}
            </section>
          </div>
        `;

        document.getElementById("songForm").addEventListener("submit", saveSong);
        document.getElementById("cancelSong")?.addEventListener("click", () => {
          editingSongId = null;
          renderSongs();
        });
        document.querySelectorAll(".edit-song").forEach((button) => {
          button.addEventListener("click", () => {
            editingSongId = Number(button.dataset.id);
            renderSongs();
          });
        });
        document.querySelectorAll(".delete-song").forEach((button) => {
          button.addEventListener("click", () => deleteSong(Number(button.dataset.id)));
        });
      }

      function formatDate(value) {
        if (!value) return "No date";
        return String(value).slice(0, 10);
      }

      function applicationActions(application) {
        if (application.status !== "pending" && application.status !== "changes_requested") {
          return "";
        }

        return `
          <button class="approve-application" data-id="${application.id}" type="button">Approve</button>
          <button class="secondary changes-application" data-id="${application.id}" type="button">Request changes</button>
          <button class="danger reject-application" data-id="${application.id}" type="button">Reject</button>
        `;
      }

      function renderApplications() {
        applicationsView.innerHTML = `
          <section class="panel list">
            <h2>Artist Applications</h2>
            ${applications.length ? "" : '<p class="subtitle">No artist applications yet.</p>'}
            ${applications
              .map(
                (application) => `
                  <div class="item wide-item">
                    <img class="thumb" src="${escapeHtml(application.photo)}" alt="" />
                    <div>
                      <div class="item-title">${escapeHtml(application.artist_name)}</div>
                      <div class="meta">
                        ${escapeHtml(application.applicant?.name || "Listener")} -
                        ${escapeHtml(application.genre || "Music")} -
                        ${escapeHtml(application.country || "Country")}${application.region ? `, ${escapeHtml(application.region)}` : ""}
                      </div>
                      <div class="details">
                        <span class="badge">${escapeHtml(application.status)}</span><br />
                        Contact: ${escapeHtml(application.contact_name)} -
                        ${escapeHtml(application.email)} -
                        ${escapeHtml(application.phone)}<br />
                        Applied: ${formatDate(application.created_at)}<br />
                        ${escapeHtml(application.bio)}
                        ${application.social_link ? `<br />Social: ${escapeHtml(application.social_link)}` : ""}
                        ${application.rejection_reason || application.review_reason ? `<br />Reason: ${escapeHtml(application.rejection_reason || application.review_reason)}` : ""}
                      </div>
                    </div>
                    <div class="actions">${applicationActions(application)}</div>
                  </div>`
              )
              .join("")}
          </section>
        `;

        document.querySelectorAll(".approve-application").forEach((button) => {
          button.addEventListener("click", () => approveApplication(Number(button.dataset.id)));
        });
        document.querySelectorAll(".changes-application").forEach((button) => {
          button.addEventListener("click", () => requestApplicationChanges(Number(button.dataset.id)));
        });
        document.querySelectorAll(".reject-application").forEach((button) => {
          button.addEventListener("click", () => rejectApplication(Number(button.dataset.id)));
        });
      }

      function releaseActions(release) {
        if (release.status !== "under_review" && release.status !== "scheduled") {
          return "";
        }

        return `
          <button class="approve-release" data-id="${release.id}" type="button">Approve</button>
          <button class="danger reject-release" data-id="${release.id}" type="button">Reject</button>
        `;
      }

      function renderReleases() {
        releasesView.innerHTML = `
          <section class="panel list">
            <h2>Release Review</h2>
            ${releases.length ? "" : '<p class="subtitle">No releases have been uploaded yet.</p>'}
            ${releases
              .map(
                (release) => `
                  <div class="item wide-item">
                    <img class="thumb" src="${escapeHtml(release.cover_image)}" alt="" />
                    <div>
                      <div class="item-title">${escapeHtml(release.title || "Untitled release")}</div>
                      <div class="meta">
                        ${escapeHtml(release.artist_name || "Artist")} -
                        ${escapeHtml(release.genre || "Genre")} -
                        ${escapeHtml(release.release_date || "No release date")}
                      </div>
                      <div class="details">
                        <span class="badge">${escapeHtml(release.status)}</span><br />
                        Type: ${escapeHtml(release.release_type || "Single")} -
                        Language: ${escapeHtml(release.language || "Not set")} -
                        Explicit: ${release.explicit ? "Yes" : "No"}<br />
                        Rights confirmed: ${release.rights_confirmed ? "Yes" : "No"}<br />
                        ${release.featured_artist ? `Featured: ${escapeHtml(release.featured_artist)}<br />` : ""}
                        ${release.producer ? `Producer: ${escapeHtml(release.producer)}<br />` : ""}
                        ${release.songwriter ? `Songwriter: ${escapeHtml(release.songwriter)}<br />` : ""}
                        ${release.description ? `${escapeHtml(release.description)}<br />` : ""}
                        ${release.rejection_reason ? `Reason: ${escapeHtml(release.rejection_reason)}<br />` : ""}
                        ${release.audio_file ? `<audio controls src="${escapeHtml(release.audio_file)}"></audio>` : "No audio file uploaded."}
                      </div>
                    </div>
                    <div class="actions">${releaseActions(release)}</div>
                  </div>`
              )
              .join("")}
          </section>
        `;

        document.querySelectorAll(".approve-release").forEach((button) => {
          button.addEventListener("click", () => approveRelease(Number(button.dataset.id)));
        });
        document.querySelectorAll(".reject-release").forEach((button) => {
          button.addEventListener("click", () => rejectRelease(Number(button.dataset.id)));
        });
      }

      function render() {
        if (!token) {
          showLogin();
          return;
        }
        showAdmin();
        if (activeTab === "songs") renderSongs();
        if (activeTab === "artists") renderArtists();
        if (activeTab === "applications") renderApplications();
        if (activeTab === "releases") renderReleases();
      }

      async function saveArtist(event) {
        event.preventDefault();
        try {
          setStatus("Saving artist...");
          await api(editingArtistId ? `/admin-api/artists/${editingArtistId}` : "/admin-api/artists", {
            method: editingArtistId ? "PUT" : "POST",
            body: new FormData(event.currentTarget),
          });
          editingArtistId = null;
          await loadData();
          setStatus("Artist saved.");
        } catch (error) {
          setStatus(error.message);
        }
      }

      async function saveSong(event) {
        event.preventDefault();
        try {
          setStatus("Saving song...");
          await api(editingSongId ? `/admin-api/songs/${editingSongId}` : "/admin-api/songs", {
            method: editingSongId ? "PUT" : "POST",
            body: new FormData(event.currentTarget),
          });
          editingSongId = null;
          await loadData();
          setStatus("Song saved.");
        } catch (error) {
          setStatus(error.message);
        }
      }

      async function deleteArtist(id) {
        if (!confirm("Delete this artist and their songs?")) return;
        try {
          await api(`/admin-api/artists/${id}`, { method: "DELETE" });
          await loadData();
          setStatus("Artist deleted.");
        } catch (error) {
          setStatus(error.message);
        }
      }

      async function deleteSong(id) {
        if (!confirm("Delete this song?")) return;
        try {
          await api(`/admin-api/songs/${id}`, { method: "DELETE" });
          await loadData();
          setStatus("Song deleted.");
        } catch (error) {
          setStatus(error.message);
        }
      }

      async function approveApplication(id) {
        if (!confirm("Approve this artist application?")) return;
        try {
          setStatus("Approving artist...");
          await api(`/admin-api/artist-applications/${id}/approve`, {
            method: "POST",
            body: JSON.stringify({}),
          });
          await loadData();
          setStatus("Artist application approved.");
        } catch (error) {
          setStatus(error.message);
        }
      }

      async function requestApplicationChanges(id) {
        const reason = prompt("What should the applicant change?");
        if (!reason) return;
        try {
          setStatus("Requesting changes...");
          await api(`/admin-api/artist-applications/${id}/request-changes`, {
            method: "POST",
            body: JSON.stringify({ reason }),
          });
          await loadData();
          setStatus("Changes requested.");
        } catch (error) {
          setStatus(error.message);
        }
      }

      async function rejectApplication(id) {
        const reason = prompt("Why is this application rejected?");
        if (!reason) return;
        try {
          setStatus("Rejecting application...");
          await api(`/admin-api/artist-applications/${id}/reject`, {
            method: "POST",
            body: JSON.stringify({ reason }),
          });
          await loadData();
          setStatus("Artist application rejected.");
        } catch (error) {
          setStatus(error.message);
        }
      }

      async function approveRelease(id) {
        if (!confirm("Approve this release?")) return;
        try {
          setStatus("Approving release...");
          await api(`/admin-api/releases/${id}/approve`, {
            method: "POST",
            body: JSON.stringify({}),
          });
          await loadData();
          setStatus("Release approved.");
        } catch (error) {
          setStatus(error.message);
        }
      }

      async function rejectRelease(id) {
        const reason = prompt("Why is this release rejected?");
        if (!reason) return;
        try {
          setStatus("Rejecting release...");
          await api(`/admin-api/releases/${id}/reject`, {
            method: "POST",
            body: JSON.stringify({ reason }),
          });
          await loadData();
          setStatus("Release rejected.");
        } catch (error) {
          setStatus(error.message);
        }
      }

      document.getElementById("loginForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        loginStatusEl.textContent = "Signing in...";
        try {
          const data = await api("/admin-api/login", {
            method: "POST",
            body: JSON.stringify({
              username: document.getElementById("loginUsername").value,
              password: document.getElementById("loginPassword").value,
            }),
          });
          token = data.token;
          localStorage.setItem("tesoAdminToken", token);
          loginStatusEl.textContent = "";
          await loadData();
        } catch (error) {
          loginStatusEl.textContent = error.message;
        }
      });

      songsTab.addEventListener("click", () => switchTab("songs"));
      artistsTab.addEventListener("click", () => switchTab("artists"));
      applicationsTab.addEventListener("click", () => switchTab("applications"));
      releasesTab.addEventListener("click", () => switchTab("releases"));
      document.getElementById("logoutButton").addEventListener("click", () => {
        token = "";
        localStorage.removeItem("tesoAdminToken");
        showLogin();
      });

      if (token) {
        loadData().catch((error) => {
          localStorage.removeItem("tesoAdminToken");
          token = "";
          showLogin();
          loginStatusEl.textContent = error.message;
        });
      } else {
        render();
      }
    </script>
  </body>
</html>
